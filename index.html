<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="./android-chrome-192x192.png">
<link rel="apple-touch-icon" href="./android-chrome-192x192.png">
<title>Blurt</title>
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#f0ede8;
  --text:#111111;--text2:#666666;--text3:#999999;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --accent:#111111;--accent-text:#ffffff;
  --green:#1D9E75;--green-bg:#E1F5EE;--green-text:#085041;--green-border:#9FE1CB;
  --red-text:#a32d2d;--red-border:rgba(163,45,45,.25);--red-bg:rgba(163,45,45,.05);
  --input-bg:#f7f7f5;--input-border:rgba(0,0,0,0.12);
  --sidebar-w:230px;
}
[data-theme="dark"]{
  --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;
  --text:#f0f0f0;--text2:#999999;--text3:#666666;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --accent:#f0f0f0;--accent-text:#1a1a1a;
  --green:#1D9E75;--green-bg:rgba(29,158,117,0.15);--green-text:#5DCAA5;--green-border:rgba(29,158,117,0.3);
  --red-text:#f09595;--red-border:rgba(240,149,149,.2);--red-bg:rgba(240,149,149,.06);
  --input-bg:#2e2e2e;--input-border:rgba(255,255,255,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg2);color:var(--text);min-height:100vh;transition:background .25s,color .25s}
input,textarea,select,button{font-family:inherit;color:var(--text)}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);border-right:1px solid var(--border);background:var(--bg3);display:flex;flex-direction:column;overflow:hidden;transition:background .25s,width .3s cubic-bezier(.4,0,.2,1),min-width .3s cubic-bezier(.4,0,.2,1)}
.sidebar.collapsed{width:0;min-width:0;border-right:none}
.sidebar-top{padding:18px 16px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.app-title{font-size:16px;font-weight:600;letter-spacing:-.3px;white-space:nowrap;overflow:hidden}
.icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border2);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:background .15s;color:var(--text2)}
.icon-btn:hover{background:var(--bg2);color:var(--text)}
.sidebar-sort{padding:0 8px 6px;flex-shrink:0}
.sort-row{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px}
.sort-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);flex:1}
.sort-btn{font-size:11px;border:none;background:transparent;cursor:pointer;color:var(--text3);padding:2px 4px;border-radius:4px}
.sort-btn:hover{color:var(--text2)}
.sort-btn.active{color:var(--text)}
.subject-list{flex:1;overflow-y:auto;padding:4px 8px;overflow-x:hidden}
.subject-item{display:flex;align-items:center;gap:9px;padding:8px 10px;cursor:pointer;font-size:13px;color:var(--text2);border-radius:8px;transition:background .15s,color .15s,transform .15s;margin-bottom:2px;white-space:nowrap;overflow:hidden}
.subject-item:hover{background:var(--bg);color:var(--text);transform:translateX(2px)}
.subject-item.active{background:var(--bg);color:var(--text);font-weight:500}
.subject-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:transform .2s}
.subject-item:hover .subject-dot,.subject-item.active .subject-dot{transform:scale(1.25)}
.subject-name{flex:1;overflow:hidden;text-overflow:ellipsis}
.subject-count{font-size:11px;color:var(--text3);flex-shrink:0}
.sidebar-footer{padding:8px 8px 14px;border-top:1px solid var(--border);flex-shrink:0}
.add-subject-btn{width:100%;padding:8px 10px;font-size:13px;border:1px solid var(--border2);border-radius:8px;background:transparent;cursor:pointer;color:var(--text2);text-align:left;display:flex;align-items:center;gap:8px;transition:background .15s,color .15s,transform .15s;white-space:nowrap}
.add-subject-btn:hover{background:var(--bg);color:var(--text);transform:translateX(2px)}
.sidebar-toggle{width:32px;height:32px;border-radius:8px;border:1px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;color:var(--text2)}
.sidebar-toggle:hover{background:var(--bg2);color:var(--text)}
.toggle-icon{display:flex;flex-direction:column;gap:4px;width:14px}
.toggle-icon span{display:block;height:1.5px;background:currentColor;border-radius:1px;transform-origin:center;transition:transform .25s,opacity .25s}
.sidebar.collapsed ~ .main .toggle-icon span:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
.sidebar.collapsed ~ .main .toggle-icon span:nth-child(2){opacity:0;transform:scaleX(0)}
.sidebar.collapsed ~ .main .toggle-icon span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg2);min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg);transition:background .25s;flex-shrink:0}
.topbar-info{flex:1;min-width:0}
.topbar-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-sub{font-size:11px;color:var(--text3);margin-top:1px}
.topbar-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.btn{padding:7px 14px;font-size:12px;font-weight:500;border:1px solid var(--border2);border-radius:8px;background:transparent;cursor:pointer;color:var(--text2);transition:background .15s,color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--bg2);color:var(--text)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-text);border-color:transparent}
.btn-primary:hover{opacity:.85;background:var(--accent);color:var(--accent-text)}
.btn-danger{color:var(--red-text);border-color:var(--red-border)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}
.hotkey-btn{font-size:12px;font-weight:500;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:5px 10px;min-width:96px;text-align:center;border:1px solid var(--border2);border-radius:7px;background:var(--bg2,transparent);color:var(--text);cursor:pointer;transition:border-color .15s,color .15s}
.hotkey-btn:hover{border-color:var(--text3)}
.hotkey-btn.recording{border-color:#534AB7;color:#534AB7;font-family:inherit;font-style:italic}
#offlineBanner{position:fixed;top:0;left:0;right:0;z-index:400;display:flex;align-items:center;gap:9px;padding:9px 16px;font-size:12.5px;line-height:1.4;color:#7a3a00;background:#ffedcc;border-bottom:1px solid #f0c67a;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#offlineBanner strong{font-weight:600}
.offline-dot{flex-shrink:0;width:8px;height:8px;border-radius:50%;background:#e8892b;box-shadow:0 0 0 3px rgba(232,137,43,.25)}
body.has-offline-banner .app{padding-top:38px}
[data-theme=dark] #offlineBanner{color:#ffd9a1;background:#3a2a12;border-bottom-color:#5a4322}
#offlineBanner.error{color:#7a1d1d;background:#fde2e2;border-bottom-color:#f0a8a8}
#offlineBanner.error .offline-dot{background:#c94242;box-shadow:0 0 0 3px rgba(201,66,66,.25)}
[data-theme=dark] #offlineBanner.error{color:#ffc4c4;background:#3a1616;border-bottom-color:#5a2626}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:600;display:flex;align-items:center;gap:12px;max-width:min(560px,calc(100vw - 32px));padding:10px 14px;border-radius:10px;background:var(--accent);color:var(--accent-text);font-size:12.5px;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.vis{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{flex-shrink:0;background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 9px;font-size:11.5px;font-weight:600;cursor:pointer;opacity:.9}
.settings-section{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:10px}
.settings-text{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:12px}
.settings-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.meter{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;margin:6px 0 4px}
.meter-fill{height:100%;border-radius:3px;background:var(--green);transition:width .3s}
.meter-fill.warn{background:#e8892b}
.meter-fill.over{background:#c94242}
.meter-label{font-size:11px;color:var(--text3)}
.blurt-table{border-collapse:collapse;width:100%;margin:8px 0;line-height:1.45}
.blurt-table th,.blurt-table td{border:1px solid var(--border2);padding:6px 9px;vertical-align:top;text-align:left}
.blurt-table th{background:var(--bg3);font-weight:600}
.ql-editor .blurt-table{cursor:pointer;user-select:none;white-space:normal}
.ql-editor .blurt-table:hover{outline:2px solid #534AB7;outline-offset:2px}
.tm-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px}
.tm-overlay[hidden]{display:none}
.tm-box{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:14px;width:780px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.tm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--border)}
.tm-title{font-size:15px;font-weight:600}
.tm-sub{font-size:12px;color:var(--text2);margin-top:3px}
.tm-body{padding:14px 20px;overflow:auto;flex:1}
.tm-titlefield{display:block;margin-bottom:12px}
.tm-titlefield span{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:5px}
.tm-titlefield input{width:100%}
.tm-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-bottom:12px;font-size:12px;color:var(--text2)}
.tm-step{display:flex;align-items:center;gap:6px}
.tm-step b{min-width:16px;text-align:center;color:var(--text)}
.tm-step .btn:disabled{opacity:.4;cursor:default}
.tm-check{display:flex;align-items:center;gap:6px;cursor:pointer}
.tm-grid-wrap{overflow-x:auto}
.tm-grid{margin:0}
.tm-grid th,.tm-grid td{padding:0;cursor:text}
.tm-cell{min-height:32px;min-width:80px;padding:6px 9px;outline:none;word-break:break-word}
.tm-cell:focus{box-shadow:inset 0 0 0 2px #534AB7}
.tm-hint{font-size:11px;color:var(--text3);margin-top:8px}
.tm-foot{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}
.tm-foot .spacer{flex:1}
.content{flex:1;overflow-y:auto;padding:24px;min-width:0}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;transition:background .25s}
.stat-n{font-size:24px;font-weight:600;letter-spacing:-.5px}
.stat-l{font-size:10px;color:var(--text3);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tab-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;background:var(--bg3);padding:4px;border-radius:10px;border:1px solid var(--border);transition:background .25s}
.tab{padding:6px 14px;font-size:12px;font-weight:500;border:none;border-radius:7px;background:transparent;cursor:pointer;color:var(--text2);transition:background .15s,color .15s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--bg);color:var(--text)}
.spec-search-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px}
.spec-search-input{flex:1;border:none;background:transparent;font-size:13px;color:var(--text);outline:none}
.spec-search-input::placeholder{color:var(--text3)}
.spec-search-clear{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:0 2px;line-height:1}
.spec-search-clear:hover{color:var(--text)}
.subtopic-filter-bar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;margin-top:4px}
.subtopic-chip{padding:3px 9px;font-size:11px;font-weight:500;border-radius:20px;border:0.5px solid var(--border2);background:transparent;cursor:pointer;color:var(--text2);transition:background .15s,color .15s}
.subtopic-chip:hover{background:var(--bg2);color:var(--text)}
.subtopic-chip.active{background:var(--text);color:var(--bg);border-color:transparent}
.topic-block{margin-bottom:28px}
.topic-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.topic-label{font-size:13px;font-weight:600;color:var(--text);flex:1}
.topic-actions{display:flex;gap:5px}
.subtopic-list{margin-bottom:8px}
.subtopic-row{border:1px solid var(--border);border-radius:10px;margin-bottom:6px;overflow:hidden;background:var(--bg);transition:background .25s}
.subtopic-header{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;user-select:none;transition:background .15s}
.subtopic-header:hover{background:var(--bg2)}
.subtopic-chevron{font-size:10px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.subtopic-row.open .subtopic-chevron{transform:rotate(90deg)}
.subtopic-name{font-size:12px;font-weight:600;color:var(--text2);flex:1}
.subtopic-count{font-size:11px;color:var(--text3)}
.subtopic-body{display:none;padding:0 10px 10px}
.subtopic-row.open .subtopic-body{display:block}
.subtopic-actions{display:flex;gap:5px;padding:6px 12px 8px;border-top:1px solid var(--border)}
.progress-wrap{margin-bottom:10px}
.progress-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:4px}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .4s}
.progress-label{font-size:11px;color:var(--text3)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:9px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:15px;transition:border-color .15s,background .25s}
.card:hover{border-color:var(--border2)}
.card-sp{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.card-q{font-size:13px;font-weight:600;margin-bottom:3px;line-height:1.4}
.card-hint{font-size:11px;color:var(--text3);margin-bottom:10px;font-style:italic}
.blurt-field{width:100%;border-radius:8px;font-size:12px;line-height:1.6;color:var(--text);transition:border-color .15s,background .25s;box-sizing:border-box}
.blurt-field.ql-container.ql-snow{border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);font-family:inherit;height:auto}
.blurt-field.ql-container.ql-snow:focus-within{border-color:var(--border2)}
.blurt-field .ql-editor{padding:9px 11px;min-height:68px;height:auto;overflow-y:visible;line-height:1.6;color:var(--text);background:transparent}
.blurt-field .ql-editor.ql-blank::before{color:var(--text3);font-style:normal;left:11px;right:11px}
.card-actions{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.card-btn{padding:5px 10px;font-size:11px;font-weight:500;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;color:var(--text2);transition:background .1s,color .1s;white-space:nowrap}
.card-btn:hover{background:var(--bg2);color:var(--text)}
.card-btn.green{color:var(--green-text);border-color:var(--green-border)}
.card-btn.green:hover{background:var(--green-bg)}
.card-btn.red{color:var(--red-text);border-color:var(--red-border)}
.card-btn.red:hover{background:var(--red-bg)}
.answer-box{display:none;margin-top:10px;padding:10px 12px;background:var(--bg2);border-left:3px solid var(--green);font-size:12px;line-height:1.65;border-radius:0 6px 6px 0}
.answer-box.vis{display:block}
.my-note{display:none;margin-top:9px;padding:10px 12px;background:var(--green-bg);border-radius:8px;border:1px solid var(--green-border);font-size:12px;line-height:1.6}
.my-note.vis{display:block}
.my-note-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--green-text);margin-bottom:3px}
.my-note-text{color:var(--green-text)}
.empty{text-align:center;padding:70px 20px 40px;color:var(--text2)}
.empty-title{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--text)}
.empty-sub{font-size:13px;margin-bottom:20px}
.dashed-add{font-size:12px;color:var(--text3);margin-bottom:8px;padding:11px 14px;background:var(--bg);border:1px dashed var(--border2);border-radius:8px;cursor:pointer;transition:background .15s,color .15s}
.dashed-add:hover{background:var(--bg2);color:var(--text2)}
.panel-backdrop{position:fixed;inset:0;z-index:200;display:flex;justify-content:flex-end;background:rgba(0,0,0,0);transition:background .28s ease;pointer-events:none;visibility:hidden}
.panel-backdrop.open{pointer-events:all;visibility:visible;background:rgba(0,0,0,.28)}
.panel{position:relative;width:400px;max-width:100vw;height:100%;background:var(--bg);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);opacity:0;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .25s ease;will-change:transform,opacity}
.panel-backdrop.open .panel{transform:translateX(0);opacity:1}
.panel-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-title{font-size:15px;font-weight:600}
.panel-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border2);background:transparent;cursor:pointer;font-size:15px;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:background .15s}
.panel-close:hover{background:var(--bg2);color:var(--text)}
.panel-body{flex:1;overflow-y:auto;padding:20px 22px}
.panel-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;background:var(--bg)}
.spacer{flex:1}
.field{margin-bottom:18px}
.field-label{display:block;font-size:10px;font-weight:700;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.07em}
.field-input{width:100%;padding:10px 13px;border:1px solid var(--input-border);border-radius:9px;font-size:14px;background:var(--input-bg);color:var(--text);transition:border-color .15s,background .25s;line-height:1.5}
.field-input:focus{outline:none;border-color:var(--border2);background:var(--bg)}
.field-input.textarea{min-height:100px;resize:vertical;font-size:13px;line-height:1.65}
.field-hint{font-size:11px;color:var(--text3);margin-top:4px}
.divider{height:1px;background:var(--border);margin:20px 0}
.section-note{font-size:12px;color:var(--text3)}
.color-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.color-swatch:hover{transform:scale(1.12)}
.color-swatch.sel{border-color:var(--text);transform:scale(1.15)}
.account-area{border-top:1px solid var(--border);margin-top:8px;padding-top:10px}
.account-signed-out{display:flex;flex-direction:column;gap:6px}
.account-hint{font-size:10px;color:var(--text3);line-height:1.5;padding:0 2px}
.account-google-btn{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--bg);cursor:pointer;font-size:12px;font-weight:500;color:var(--text);transition:background .15s}
.account-google-btn:hover{background:var(--bg2)}
.account-signed-in{display:flex;flex-direction:column;gap:6px}
.account-row{display:flex;align-items:center;gap:8px}
.account-avatar{width:28px;height:28px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#3C3489;flex-shrink:0}
.account-info{flex:1;min-width:0}
.account-name{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-email{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-sync-row{display:flex;align-items:center;gap:5px;border-radius:5px;padding:1px 2px;margin:0 -2px}
.account-sync-row.clickable{cursor:pointer}
.account-sync-row.clickable:hover{background:var(--bg2)}
.account-sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.account-sync-label{font-size:10px;color:var(--green-text)}
.account-sync-row[data-s=saving] .account-sync-dot,.account-sync-row[data-s=connecting] .account-sync-dot{background:#e8a33b;animation:syncPulse 1s ease-in-out infinite}
.account-sync-row[data-s=saving] .account-sync-label,.account-sync-row[data-s=connecting] .account-sync-label{color:var(--text2)}
.account-sync-row[data-s=offline] .account-sync-dot{background:#e8892b}
.account-sync-row[data-s=offline] .account-sync-label{color:#a35a10}
.account-sync-row[data-s=error] .account-sync-dot,.account-sync-row[data-s=toolarge] .account-sync-dot{background:#c94242}
.account-sync-row[data-s=error] .account-sync-label,.account-sync-row[data-s=toolarge] .account-sync-label{color:var(--red-text)}
@keyframes syncPulse{50%{opacity:.35}}
.account-signout-btn{width:100%;padding:5px 8px;font-size:11px;font-weight:500;border-radius:6px;border:1px solid var(--red-border);background:transparent;cursor:pointer;color:var(--red-text);transition:background .15s}
.account-signout-btn:hover{background:var(--red-bg)}
/* ── Quill answer editor (panel) ── */
.quill-answer-wrap{border:1px solid var(--input-border);border-radius:9px;overflow:hidden;background:var(--input-bg);transition:border-color .15s,background .25s}
.quill-answer-wrap:focus-within{border-color:var(--border2)}
.quill-answer-wrap .ql-toolbar.ql-snow{border:none;border-bottom:1px solid var(--border2);background:var(--bg3);padding:5px 8px;flex-wrap:wrap}
.quill-answer-wrap .ql-container.ql-snow{border:none;font-size:13px;font-family:inherit;height:auto}
.quill-answer-wrap .ql-editor{min-height:100px;height:auto;overflow-y:visible;padding:10px 13px;color:var(--text);background:transparent;line-height:1.65;word-break:break-word}
.quill-answer-wrap .ql-editor.ql-blank::before{color:var(--text3);font-style:normal;left:13px;right:13px}
/* ── Quill dark mode ── */
[data-theme="dark"] .ql-snow .ql-stroke{stroke:var(--text2)}
[data-theme="dark"] .ql-snow .ql-fill{fill:var(--text2)}
[data-theme="dark"] .ql-snow .ql-picker{color:var(--text2)}
[data-theme="dark"] .ql-toolbar.ql-snow button:hover .ql-stroke,[data-theme="dark"] .ql-toolbar.ql-snow button.ql-active .ql-stroke{stroke:var(--text)}
[data-theme="dark"] .ql-toolbar.ql-snow button:hover .ql-fill,[data-theme="dark"] .ql-toolbar.ql-snow button.ql-active .ql-fill{fill:var(--text)}
[data-theme="dark"] .ql-snow .ql-tooltip{background:var(--bg3);border-color:var(--border2);color:var(--text);box-shadow:none}
[data-theme="dark"] .ql-snow .ql-tooltip input[type=text]{background:var(--input-bg);border-color:var(--border2);color:var(--text);outline:none}
[data-theme="dark"] .ql-snow .ql-tooltip a{color:var(--text2)}
[data-theme="dark"] .ql-picker-options{background:var(--bg3) !important;border-color:var(--border2) !important}
/* ── Rich content in answer-box and my-note ── */
.answer-box img{max-width:100%;border-radius:4px;margin-top:4px}
.my-note-text img{max-width:100%;border-radius:4px;margin-top:4px}
/* ── Sleek scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
* {scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
/* ── Confidence dot ── */
.conf-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px;vertical-align:middle;flex-shrink:0}
.conf-dot.got{background:#1D9E75}.conf-dot.almost{background:#E68A00}.conf-dot.missed{background:#C0392B}
/* ── Study setup modal ── */
.study-modal-overlay{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.study-modal{background:var(--bg);border:1px solid var(--border);border-radius:16px;width:520px;max-width:94vw;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.study-modal-header{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.study-modal-title{font-size:16px;font-weight:600}
.study-modal-body{flex:1;overflow-y:auto;padding:16px 20px}
.study-modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-shrink:0;background:var(--bg)}
.study-topic-block{margin-bottom:10px}
.study-topic-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:5px;cursor:pointer;user-select:none}
.study-topic-label input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.study-subtopic-list{margin-left:22px;display:flex;flex-direction:column;gap:3px}
.study-subtopic-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none}
.study-subtopic-item input[type=checkbox]{width:13px;height:13px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.study-options-row{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.study-option-btn{padding:5px 13px;font-size:12px;font-weight:500;border:1px solid var(--border2);border-radius:20px;background:transparent;cursor:pointer;color:var(--text2);transition:background .15s,color .15s}
.study-option-btn.active{background:var(--accent);color:var(--accent-text);border-color:transparent}
/* ── Session view ── */
.session-view{display:flex;flex-direction:column;height:100%}
.session-topbar{display:flex;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;gap:12px}
.session-progress-text{flex:1;text-align:center;font-size:13px;font-weight:500;color:var(--text2)}
.session-timer{font-size:13px;font-weight:500;color:var(--text2);min-width:48px;text-align:right}
.session-content{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;align-items:center}
.session-card-wrap{width:100%;max-width:600px}
.session-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:14px;transition:background .25s}
.session-card-sp{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:5px}
.session-card-q{font-size:17px;font-weight:600;line-height:1.4;margin-bottom:6px}
.session-card-hint{font-size:12px;color:var(--text3);font-style:italic;margin-bottom:12px}
.session-blurt-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:5px;margin-top:12px}
.session-blurt{width:100%;min-height:140px;padding:10px 13px;border:1px solid var(--input-border);border-radius:9px;background:var(--input-bg);font-family:inherit;font-size:13px;color:var(--text);resize:none;overflow-y:hidden;transition:border-color .15s,background .25s;line-height:1.6}
.session-blurt:focus{outline:none;border-color:var(--border2)}
.session-show-btn{width:100%;padding:11px;font-size:13px;font-weight:500;border:1px solid var(--border2);border-radius:10px;background:transparent;cursor:pointer;color:var(--text2);transition:background .15s,color .15s;margin-bottom:12px}
.session-show-btn:hover{background:var(--bg2);color:var(--text)}
.session-answer-wrap{display:none;margin-bottom:12px}
.session-answer-wrap.vis{display:block}
.session-answer-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--green-text);margin-bottom:6px}
.session-answer-body{padding:11px 14px;background:var(--bg2);border-left:3px solid var(--green);font-size:13px;line-height:1.65;border-radius:0 6px 6px 0}
.session-answer-body img{max-width:100%;border-radius:4px;margin-top:4px}
.conf-row{display:flex;gap:8px;margin-top:4px}
.conf-btn{flex:1;padding:12px 10px;font-size:13px;font-weight:600;border-radius:10px;border:none;cursor:pointer;transition:opacity .15s,transform .1s}
.conf-btn:active{transform:scale(.97)}
.conf-btn.got{background:#1D9E75;color:#fff}
.conf-btn.almost{background:#E68A00;color:#fff}
.conf-btn.missed{background:#C0392B;color:#fff}
.conf-btn:hover{opacity:.85}
.conf-btn:disabled{cursor:default}
/* ── End screen ── */
.session-end{width:100%;max-width:600px}
.session-end-title{font-size:20px;font-weight:700;margin-bottom:4px}
.session-end-sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.end-stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.end-stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;transition:background .25s}
.end-stat-n{font-size:22px;font-weight:700}
.end-stat-l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-top:2px}
.end-stat.got .end-stat-n{color:#1D9E75}.end-stat.almost .end-stat-n{color:#E68A00}.end-stat.missed .end-stat-n{color:#C0392B}
.end-breakdown{margin-bottom:20px}
.end-breakdown-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:8px}
.end-topic-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.end-topic-row:last-child{border-bottom:none}
.end-topic-name{flex:1;color:var(--text)}
.end-topic-pills{display:flex;gap:4px;flex-wrap:wrap}
.end-pill{padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.end-pill.got{background:var(--green-bg);color:var(--green-text)}
.end-pill.almost{background:rgba(230,138,0,.12);color:#996000}
.end-pill.missed{background:var(--red-bg);color:var(--red-text)}
[data-theme="dark"] .end-pill.almost{background:rgba(230,138,0,.15);color:#E68A00}
.end-actions{display:flex;gap:8px;flex-wrap:wrap}
/* ── Weak areas ── */
.weak-areas-section{margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}
.weak-areas-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:10px}
.weak-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.weak-row:last-child{border-bottom:none}
.weak-name{flex:1;color:var(--text)}
.weak-pills{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap}
.weak-pill{padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.weak-pill.got{background:var(--green-bg);color:var(--green-text)}
.weak-pill.almost{background:rgba(230,138,0,.12);color:#996000}
.weak-pill.missed{background:var(--red-bg);color:var(--red-text)}
[data-theme="dark"] .weak-pill.almost{background:rgba(230,138,0,.15);color:#E68A00}
.weak-bar-wrap{width:60px;flex-shrink:0}
.weak-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.weak-bar-fill{height:100%;border-radius:2px}
/* ── Rich text (answers, notes, session) — drawn to match the editor ── */
.rich ul,.rich ol{padding-left:1.5em;margin:4px 0}
.rich li{margin-bottom:3px}
.rich li>ul,.rich li>ol{margin:3px 0 0}
.rich ul{list-style:disc}.rich ul ul{list-style:circle}.rich ul ul ul{list-style:square}.rich ul ul ul ul{list-style:disc}
.rich ol{list-style:decimal}.rich ol ol{list-style:lower-alpha}.rich ol ol ol{list-style:lower-roman}.rich ol ol ol ol{list-style:decimal}
.rich li.nest-only{list-style:none}
.rich p{margin:0}
.rich img{max-width:100%;border-radius:4px;margin-top:4px}
/* Editor lists: same indent per level as the display, and bullets • ◦ ▪ like disc/circle/square */
.ql-snow .ql-editor ol,.ql-snow .ql-editor ul{padding-left:0}
.ql-snow .ql-editor li:not(.ql-direction-rtl){padding-left:1.5em}
.ql-snow .ql-editor ul>li.ql-indent-1::before,.ql-snow .ql-editor ul>li.ql-indent-4::before,.ql-snow .ql-editor ul>li.ql-indent-7::before{content:'\25E6'}
.ql-snow .ql-editor ul>li.ql-indent-2::before,.ql-snow .ql-editor ul>li.ql-indent-5::before,.ql-snow .ql-editor ul>li.ql-indent-8::before{content:'\25AA'}
.ql-snow .ql-editor li.ql-indent-1:not(.ql-direction-rtl){padding-left:3em}
.ql-snow .ql-editor .ql-indent-1:not(.ql-direction-rtl):not(li){padding-left:1.5em}
.ql-snow .ql-editor li.ql-indent-2:not(.ql-direction-rtl){padding-left:4.5em}
.ql-snow .ql-editor .ql-indent-2:not(.ql-direction-rtl):not(li){padding-left:3em}
.ql-snow .ql-editor li.ql-indent-3:not(.ql-direction-rtl){padding-left:6em}
.ql-snow .ql-editor .ql-indent-3:not(.ql-direction-rtl):not(li){padding-left:4.5em}
.ql-snow .ql-editor li.ql-indent-4:not(.ql-direction-rtl){padding-left:7.5em}
.ql-snow .ql-editor .ql-indent-4:not(.ql-direction-rtl):not(li){padding-left:6em}
.ql-snow .ql-editor li.ql-indent-5:not(.ql-direction-rtl){padding-left:9em}
.ql-snow .ql-editor .ql-indent-5:not(.ql-direction-rtl):not(li){padding-left:7.5em}
.ql-snow .ql-editor li.ql-indent-6:not(.ql-direction-rtl){padding-left:10.5em}
.ql-snow .ql-editor .ql-indent-6:not(.ql-direction-rtl):not(li){padding-left:9em}
.ql-snow .ql-editor li.ql-indent-7:not(.ql-direction-rtl){padding-left:12em}
.ql-snow .ql-editor .ql-indent-7:not(.ql-direction-rtl):not(li){padding-left:10.5em}
.ql-snow .ql-editor li.ql-indent-8:not(.ql-direction-rtl){padding-left:13.5em}
.ql-snow .ql-editor .ql-indent-8:not(.ql-direction-rtl):not(li){padding-left:12em}

/* ── Sidebar extras ── */
.sidebar-icons{display:flex;gap:5px}
.icon-btn svg{display:block}
.archived-toggle{display:flex;align-items:center;gap:6px;width:100%;margin-top:10px;padding:6px 10px;border:none;background:none;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text3);text-align:left;border-radius:6px}
.archived-toggle:hover{color:var(--text2);background:var(--bg)}
.subject-item.archived{opacity:.7}
.archived-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:16px;border:1px dashed var(--border2);border-radius:10px;font-size:12.5px;color:var(--text2);background:var(--bg)}
.archived-banner .spacer{flex:1}
.sidebar-scrim{display:none}

/* ── Keyboard selection & search flash ── */
.card.kb-focus{border-color:#534AB7;box-shadow:0 0 0 2px rgba(83,74,183,.18)}
@keyframes cardFlash{0%,40%{box-shadow:0 0 0 4px rgba(83,74,183,.35)}100%{box-shadow:0 0 0 2px rgba(83,74,183,.18)}}
.card.flash{animation:cardFlash 1.4s ease-out}
kbd,.kbd-hint{display:inline-block;min-width:1.6em;padding:1px 5px;border:1px solid var(--border2);border-bottom-width:2px;border-radius:5px;font:600 10.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;color:var(--text2);background:var(--bg)}
.kbd-hint{margin-left:6px;opacity:.75;color:inherit;background:transparent;border-color:currentColor}

/* ── Study session: side by side ── */
.session-card-wrap{transition:max-width .25s}
.session-card-wrap.revealed{max-width:1040px}
.session-q-card{margin-bottom:12px}
.session-q-card .session-card-hint{margin-bottom:0}
.session-cols{display:block}
.session-col .session-blurt-label{margin-top:0}
.session-model,.session-rate{display:none}
.revealed .session-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.revealed .session-cols>.session-card{margin-bottom:0;height:100%}
.revealed .session-model,.revealed .session-rate{display:block}
.revealed #sessionShowBtn{display:none}
.session-rate{margin-top:14px}
.session-answer-label{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.kw-score{font-weight:500;text-transform:none;letter-spacing:0;color:var(--text3);font-size:11px}
.kw{border-radius:3px;padding:0 1px}
.kw.hit{background:rgba(29,158,117,.18);box-shadow:inset 0 -1.5px 0 rgba(29,158,117,.7)}
.kw.miss{background:rgba(230,138,0,.16);box-shadow:inset 0 -1.5px 0 rgba(230,138,0,.75)}
.rate-suggest{font-size:12px;color:var(--text2);margin-bottom:8px;min-height:1px}
.conf-btn.got.suggested{box-shadow:0 0 0 3px var(--bg2),0 0 0 5px #1D9E75}
.conf-btn.almost.suggested{box-shadow:0 0 0 3px var(--bg2),0 0 0 5px #E68A00}
.conf-btn.missed.suggested{box-shadow:0 0 0 3px var(--bg2),0 0 0 5px #C0392B}
.conf-btn .kbd-hint{border-color:rgba(255,255,255,.6);color:#fff}

/* ── Bulk add ── */
.bulk-box{width:1040px;height:min(760px,92vh)}
.bulk-tabs{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--border)}
.bulk-tab{padding:8px 12px;border:none;background:none;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px}
.bulk-tab.active{color:var(--text);border-bottom-color:var(--text)}
.bulk-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.bulk-left{padding:14px 20px;overflow:auto;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--border)}
.bulk-right{padding:14px 20px;overflow:auto;min-height:0}
.bulk-left .field-label{margin-bottom:0}
.bulk-text{min-height:200px;flex:1;resize:vertical;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;tab-size:12}
.bulk-check{font-size:12.5px;display:flex;gap:7px;align-items:center;color:var(--text2)}
.bulk-help{font-size:12.5px;color:var(--text2);line-height:1.55}
.bulk-help summary{cursor:pointer;font-weight:600;color:var(--text);padding:4px 0}
.bulk-help p{margin:6px 0}
.bulk-fmt{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)}
.bulk-fmt .btn{flex-shrink:0}
.bulk-note{color:var(--text3)}
code{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg3);padding:1px 4px;border-radius:4px}
.bulk-preview{display:flex;flex-direction:column;gap:6px}
.bulk-format{font-size:11px;color:var(--text3);margin-bottom:2px}
.bulk-warn{font-size:12px;color:#996000;background:rgba(230,138,0,.1);padding:6px 9px;border-radius:6px}
.bulk-sub{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-top:8px}
.bulk-row{border:1px solid var(--border);border-radius:9px;padding:8px 11px;background:var(--bg);font-size:12.5px}
.bulk-sp{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.05em}
.bulk-q{font-weight:600}
.bulk-a{margin-top:3px;color:var(--text2);font-size:12px}
.bulk-missing{color:#996000;font-style:italic}
.bulk-empty{font-size:12.5px;color:var(--text3);padding:20px 0;text-align:center}
.bulk-summary{font-size:12px;color:var(--text2)}
.btn:disabled{opacity:.45;cursor:default}

/* ── Search ── */
.search-overlay{align-items:flex-start;padding-top:12vh}
.search-box{width:640px;max-height:70vh}
.search-bar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);color:var(--text3)}
.search-input{flex:1;border:none;outline:none;background:none;font-size:15px;color:var(--text)}
.search-results{overflow:auto;padding:6px}
.search-row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:8px;cursor:pointer}
.search-row .subject-dot{margin-top:6px}
.search-row.sel{background:var(--bg2)}
.search-main{min-width:0;flex:1}
.search-q{font-size:13px;font-weight:600;color:var(--text)}
.search-sp{font-size:10px;font-weight:600;color:var(--text3);margin-right:7px;letter-spacing:.04em}
.search-snip{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.45}
.search-path{font-size:11px;color:var(--text3);margin-top:2px}
.search-tag{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);border:1px solid var(--border2);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}

<script type="module">
// Thin Firebase adapter. All sync decisions live in the main script (Sync);
// this module only talks to Auth/Firestore and reports back via window.Sync.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, runTransaction, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyCSLOk9TuRlGlpbDBoPkdlOtdXE0-rlEHk",authDomain:"blurt-fe2a5.firebaseapp.com",projectId:"blurt-fe2a5",storageBucket:"blurt-fe2a5.firebasestorage.app",messagingSenderId:"138136838097",appId:"1:138136838097:web:99e50d3ca3e301f1604af0"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const readDoc=snap=>{const d=snap.exists()?snap.data():null;return{exists:snap.exists(),rev:(d&&d.rev)||null,state:(d&&d.state)||null,savedAt:(d&&d.savedAt)||null,device:(d&&d.device)||null};};
let unwatch=null;
window.blurtCloud={
  signIn:()=>signInWithPopup(auth,new GoogleAuthProvider()),
  signOut:()=>auth.signOut(),
  // Live view of users/{uid}. Fires once the doc is reachable, then on every change.
  watch(uid,onDoc,onErr){
    if(unwatch)unwatch();
    unwatch=onSnapshot(doc(db,'users',uid),snap=>onDoc(readDoc(snap)),onErr);
  },
  unwatch(){if(unwatch){unwatch();unwatch=null;}},
  // Write only if the cloud is still at expectedRev (the version this device last
  // saw). If another device wrote in between, nothing is written and the current
  // cloud doc comes back so the caller can merge.
  push(uid,payload,expectedRev){
    const ref=doc(db,'users',uid);
    return runTransaction(db,async tx=>{
      const snap=await tx.get(ref);
      const cur=readDoc(snap);
      if(cur.exists&&cur.rev!==expectedRev)return{conflict:true,cloud:cur};
      tx.set(ref,payload);
      return{ok:true};
    });
  },
  addSession:(uid,data)=>addDoc(collection(db,'users',uid,'sessions'),data)
};
onAuthStateChanged(auth,user=>{updateAccountUI(user);window.Sync.onUser(user);});
function updateAccountUI(user){
  const out=document.getElementById('accountSignedOut'),inn=document.getElementById('accountSignedIn');
  if(user){
    out.style.display='none';inn.style.display='flex';
    const name=user.displayName?user.displayName.split(' ')[0]:'User';
    document.getElementById('accountName').textContent=name;
    document.getElementById('accountEmail').textContent=user.email;
    document.getElementById('accountInitials').textContent=(user.displayName||'U').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  }else{out.style.display='flex';inn.style.display='none';}
}
</script>

<script>
const PALETTE=[{c:'#534AB7'},{c:'#0F6E56'},{c:'#993C1D'},{c:'#185FA5'},{c:'#854F0B'},{c:'#993556'},{c:'#3B6D11'},{c:'#555555'}];
let state={subjects:[],deleted:{},activeSubId:null,activeTopicId:null,activeSpFilter:null,theme:'light',sidebarOpen:true,sortOrder:'az'};
let panel={type:null,editId:null,topicId:null,subtopicId:null,selColor:PALETTE[0].c};
let _closeTimer=null;
let _answerQuill=null;
let _blurtQuills={};
let _session=null;

// ── Local storage ──
// The whole state lives in IndexedDB: localStorage caps out around 5 MB, which a
// few pasted images can fill. Falls back to localStorage if IndexedDB is
// unavailable (some private windows). Keys: 'state', 'meta' (sync bookkeeping)
// and 'backup' (the last version Blurt replaced, restorable from Settings).
const Store=(()=>{
  let mode=null,dbp=null;
  const LS='blurt:';
  function idb(){
    if(!dbp)dbp=new Promise((res,rej)=>{
      const r=indexedDB.open('blurt',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('kv');
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('IndexedDB blocked'));
    });
    return dbp;
  }
  async function init(){
    if(mode)return mode;
    try{if(!window.indexedDB)throw new Error('no IndexedDB');await idb();mode='idb';}catch(e){mode='ls';}
    return mode;
  }
  async function get(k){
    await init();
    if(mode==='ls'){const raw=localStorage.getItem(LS+k);return raw?JSON.parse(raw):undefined;}
    const db=await idb();

// UI state that belongs to this device only: never synced, never overwritten by the cloud.
const LOCAL_ONLY=['activeSubId','activeTopicId','activeSpFilter','activeSubtopicSpFilters','openSubtopics','sidebarOpen','showArchived'];
const HISTORY_CAP=50;            // rating history kept per card (totals are kept separately)
const TOMBSTONE_TTL=180*864e5;   // how long deletions are remembered for merging
const SAFE_ID=/^[\w-]{1,64}$/;

// Fill defaults and repair anything malformed (old saves, imported files) so the
// renderer can trust ids, colours and list shapes.
function normalizeState(s){
  s=s&&typeof s==='object'?s:{};
  if(!Array.isArray(s.subjects))s.subjects=[];
  if(!s.theme)s.theme='light';
  if(s.sidebarOpen===undefined)s.sidebarOpen=true;
  if(!s.sortOrder)s.sortOrder='az';
  if(!s.activeSpFilter)s.activeSpFilter=null;
  if(!s.deleted||typeof s.deleted!=='object')s.deleted={};
  s.hotkeys=Object.assign(defaultHotkeys(),s.hotkeys||{});
  s.studyPrefs=Object.assign({highlightTerms:true,suggestRating:true},s.studyPrefs);
  const fixId=x=>{if(!SAFE_ID.test(String(x.id||'')))x.id=uid();};
  const list=a=>(Array.isArray(a)?a:[]).filter(x=>x&&typeof x==='object');
  const cards=a=>list(a).map(c=>{fixId(c);capHistory(c);return c;});
  s.subjects=list(s.subjects);
  s.subjects.forEach(sub=>{
    fixId(sub);sub.name=String(sub.name||'Untitled');
    if(!/^#[0-9a-f]{3,8}$/i.test(sub.color||''))sub.color=PALETTE[0].c;
    sub.topics=list(sub.topics);
    sub.topics.forEach(t=>{
      fixId(t);t.name=String(t.name||'Untitled');t.cards=cards(t.cards);
      t.subtopics=list(t.subtopics);
      t.subtopics.forEach(st=>{fixId(st);st.name=String(st.name||'Untitled');st.cards=cards(st.cards);});
    });
  });
  return s;
}
function capHistory(c){const h=c.confidence&&c.confidence.history;if(Array.isArray(h)&&h.length>HISTORY_CAP)c.confidence.history=h.slice(-HISTORY_CAP);}
function hasContent(s){return!!(s&&Array.isArray(s.subjects)&&s.subjects.length);}
function eachCard(s,fn){(s.subjects||[]).forEach(sub=>(sub.topics||[]).forEach(t=>{(t.cards||[]).forEach(fn);(t.subtopics||[]).forEach(st=>(st.cards||[]).forEach(fn));}));}
function eachItem(s,fn){(s.subjects||[]).forEach(sub=>{fn(sub);(sub.topics||[]).forEach(t=>{fn(t);(t.cards||[]).forEach(fn);(t.subtopics||[]).forEach(st=>{fn(st);(st.cards||[]).forEach(fn);});});});}
function countCards(s){let n=0;eachCard(s,()=>n++);return n;}
function markDeleted(id){if(!state.deleted)state.deleted={};state.deleted[id]=Date.now();}
function pruneTombstones(d){const out={},cut=Date.now()-TOMBSTONE_TTL;Object.entries(d||{}).forEach(([k,v])=>{if(v>cut)out[k]=v;});return out;}
// Stamp every item as just edited and forget deletions of them, so a restored or
// imported copy wins when it later meets other devices' data in a merge.
function touchAll(s){const now=Date.now();s.deleted=s.deleted||{};eachItem(s,x=>{x.updatedAt=now;if(x.myNote)x.noteAt=now;delete s.deleted[x.id];});}

let syncMeta={synced:false,baseRev:null,dirty:false,editedAt:0,uid:null,pendingSessions:[]};
let _editSeq=0,_loadFailed=false;
let _resolveReady;const _ready=new Promise(r=>_resolveReady=r);

async function load(){
  let s,meta;
  try{
    ({state:s,meta,ver:_storeVer=0}=await Store.getMany(['state','meta','ver']));_storeVer=_storeVer||0;
    if(s===undefined){
      // One-off move from the old localStorage key.
      const raw=localStorage.getItem('blurt3');
      if(raw){s=JSON.parse(raw);await Store.put({state:s,meta:syncMeta});localStorage.removeItem('blurt3');}
    }
  }catch(e){
    // Don't write anything this session: an empty state saved over unreadable data would destroy it.
    console.error('[Blurt] load failed',e);_loadFailed=true;
    try{const raw=localStorage.getItem('blurt3');if(raw)s=JSON.parse(raw);}catch(_){}
    setTimeout(()=>toast("Couldn't open your saved data on this device. Changes this session won't be kept — reload to try again.",{ms:12000}),0);
  }
  state=normalizeState(s||state);
  if(isNarrow())state.sidebarOpen=!state.activeSubId;
  if(meta)syncMeta=Object.assign(syncMeta,meta);
  if(!Array.isArray(syncMeta.pendingSessions))syncMeta.pendingSessions=[];
  syncMeta.pendingSessions.forEach(d=>{if(d&&!d.id)d.id=uid();});
  await Tabs.start();
  if(Tabs.ch)Tabs.refresh(false); // catch a write another tab made while this one was loading
  applyTheme();applySidebar();renderSidebar();
  document.getElementById('sortAZ').classList.toggle('active',state.sortOrder==='az');
  document.getElementById('sortNew').classList.toggle('active',state.sortOrder==='new');
  if(state.activeSubId)renderMain();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

// Content or synced preference changed: keep it locally and queue a cloud sync.
function save(){
  syncMeta.dirty=true;syncMeta.editedAt=Date.now();_editSeq++;_tabEdit=true;
  persistSoon();Sync.changed();
}
// Device-only UI change (navigation, expanded sections): local, never synced.
function saveUI(){persistSoon();}
let _persistTimer=null,_persistErr=null;
// _changeSeq counts local changes, _sharedSeq the last one written to storage
// (and so announced to other tabs); _tabEdit: a content edit is among them.
// _storeVer: the stored version (key `ver`, bumped by every write) this tab's
// copy includes. If storage has moved past it, another tab wrote in between and
// the write merges with what's there instead of replacing it.
let _changeSeq=0,_sharedSeq=0,_persisting=0,_tabEdit=false,_storeVer=0;
function persistSoon(){_changeSeq++;clearTimeout(_persistTimer);_persistTimer=setTimeout(persistNow,250);}
async function persistNow(){
  clearTimeout(_persistTimer);_persistTimer=null;
  if(_loadFailed)return;
  const seq=_changeSeq,edit=_tabEdit;_tabEdit=false;_persisting++;
  let merged=null,ver=0;
  try{
    await Store.tx((get,set)=>get('ver',v=>{
      v=v||0;ver=v+1;
      const write=s=>{set('state',s);set('ver',ver);get('meta',m=>set('meta',Tabs.mergeMeta(m,syncMeta,edit)));};
      if(v===_storeVer)write(state);
      else get('state',s=>write(merged=s?mergeStates(state,s):state));
    }));
    _storeVer=Math.max(_storeVer,ver);
    if(merged&&merged!==state)replaceState(mergeStates(state,merged));
    _sharedSeq=Math.max(_sharedSeq,seq);
    Tabs.post({type:'saved',edit});
    if(_persistErr){_persistErr=null;renderSyncStatus();}
  }catch(e){
    if(edit)_tabEdit=true;
    console.error('[Blurt] local save failed',e);
    _persistErr=e;renderSyncStatus();
  }finally{_persisting--;}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(_persistTimer)persistNow();Sync.flush();}});
window.addEventListener('pagehide',()=>{if(_persistTimer)persistNow();});

// ── Other tabs ──
// Every open tab holds its own copy of the data, so tabs tell each other (over a
// BroadcastChannel) whenever they write to storage. A tab with no unsaved
// changes of its own takes the stored copy; one with changes merges it in
// (mergeStates) and writes the result back. Only one tab, the leader (holder of
// a Web Lock), talks to the cloud: it pushes edits made in any tab and its
// cloud updates reach the other tabs through storage. When it closes, the next
// tab takes over. The leader owns the sync bookkeeping in `meta`; other tabs
// only add their queued study sessions and a "has edits" flag to it.
const Tabs={
  id:uid(),leader:true,ch:null,busy:false,again:false,
  start(){
    if(!('BroadcastChannel' in window)||!(navigator.locks&&navigator.locks.request))return Promise.resolve(); // one tab at a time, as before
    this.ch=new BroadcastChannel('blurt');
    this.ch.onmessage=e=>this.onMessage(e.data||{});
    const hold=()=>new Promise(()=>{}); // never released: the lock goes when the tab closes
    return new Promise(decided=>{
      navigator.locks.request('blurt-sync',{ifAvailable:true},lock=>{
        if(lock){this.leader=true;decided();return hold();}
        this.leader=false;decided();this.post({type:'hello'});
        navigator.locks.request('blurt-sync',()=>{this.takeOver();return hold();});
      });
    });
  },
  post(m){if(this.ch)try{this.ch.postMessage(Object.assign({from:this.id},m));}catch(e){}},
  onMessage(m){
    if(m.from===this.id)return;
    if(m.type==='saved')this.refresh(m.edit&&this.leader);
    else if(m.type==='hello'&&this.leader)this.postStatus();
    else if(m.type==='status'&&!this.leader){Sync.status=m.status;Sync.detail=m.detail;syncMeta.dirty=m.dirty;renderSyncStatus();}
    else if(m.type==='retry'&&this.leader)Sync.push();
  },
  postStatus(){if(this.leader)this.post({type:'status',status:Sync.status,detail:Sync.detail,dirty:!!syncMeta.dirty});},
  // Another tab wrote to storage: bring this tab up to date.
  refresh(edited){
    if(this.busy){this.again=true;this.edited=this.edited||edited;return;}
    this.busy=true;this.edited=edited;
    _ready.then(async()=>{
      try{do{this.again=false;const e=this.edited;this.edited=false;await this.pull(e);}while(this.again);}
      catch(e){console.error('[Blurt] reading another tab\'s changes failed',e);}
      this.busy=false;
    });
  },
  async pull(edited){
    if(_loadFailed)return;
    const{state:s,meta,ver=0}=await Store.getMany(['state','meta','ver']);
    if(s&&ver>_storeVer){
      // Every write includes what was stored before it, so a tab with nothing
      // unsaved can simply take the stored copy.
      if(_persistTimer||_persisting||_changeSeq!==_sharedSeq){
        replaceState(mergeStates(state,s));
        if(!_persistTimer&&!_persisting)persistSoon();
      }else if(cloudJSON(s)!==cloudJSON(state))replaceState(s);
      _storeVer=ver;
    }
    if(meta){
      if(this.leader){const m=this.mergeMeta(meta,syncMeta,false);syncMeta.pendingSessions=m.pendingSessions;syncMeta.uploadedSessions=m.uploadedSessions;}
      else Object.assign(syncMeta,meta);
    }
    if(this.leader){
      if(edited){syncMeta.dirty=true;syncMeta.editedAt=Date.now();_editSeq++;Sync.changed();}
      Sync.flushSessions();
    }
    renderSyncStatus();
  },
  // The previous leader closed: pick up its bookkeeping, then connect.
  async takeOver(){
    await _ready;
    await this.pull(false).catch(()=>{});
    this.leader=true;
    if(Sync.user)Sync._onUser(Sync.user);
  },
  // What a tab writes to `meta`, given what is stored: study-session queues are
  // combined (minus ones already uploaded); a non-leader keeps the leader's
  // sync bookkeeping and only marks unsynced edits.
  mergeMeta(old,cur,edit){
    if(!old||!this.ch)return cur;
    const out=this.leader?Object.assign({},cur):Object.assign({},old,{dirty:!!(old.dirty||edit),editedAt:Math.max(old.editedAt||0,edit?Date.now():0)});
    const up=[...new Set([...(old.uploadedSessions||[]),...(cur.uploadedSessions||[])])].slice(-200);
    const seen=new Set(up),pending=[];
    [...(old.pendingSessions||[]),...(cur.pendingSessions||[])].forEach(d=>{if(d&&d.id&&!seen.has(d.id)){seen.add(d.id);pending.push(d);}});
    out.uploadedSessions=up;out.pendingSessions=pending.slice(-200);
    return out;
  }
};
async function saveBackup(s,reason){
  try{await Store.put({backup:{at:Date.now(),reason,state:JSON.parse(JSON.stringify(s))}});}catch(e){console.error('[Blurt] backup failed',e);}
}

// ── Cloud sync ──
// The cloud doc (users/{uid}) carries a revision id. This device remembers the
// revision its data is based on (syncMeta.baseRev; only meaningful once
// syncMeta.synced is set for the signed-in account) and whether it has edits the
// cloud hasn't seen (syncMeta.dirty). Writes only succeed if the cloud is still
// at baseRev, so devices never silently overwrite each other: when the cloud has
// moved on, a device without edits adopts it and a device with edits merges
// (mergeStates). Whatever gets replaced is kept as a restorable backup.
const CLOUD_LIMIT=1000000; // Firestore allows 1 MiB per document; leave headroom for the envelope
const Sync={
  user:null,status:'local',detail:'',inflight:null,again:false,timer:null,retryMs:0,
  onUser(user){_ready.then(()=>this._onUser(user));},
  _onUser(user){
    clearTimeout(this.timer);clearTimeout(this.watchRetry);
    if(!user){this.user=null;if(window.blurtCloud)blurtCloud.unwatch();this.setStatus('local');return;}
    this.user=user;
    if(!Tabs.leader){renderSyncStatus();return;} // the leader tab syncs for everyone (Tabs.takeOver)
    this.accountSwitch=!!(syncMeta.uid&&syncMeta.uid!==user.uid);
    if(syncMeta.uid!==user.uid)syncMeta.synced=false;
    syncMeta.uid=user.uid;persistSoon();
    this.setStatus('connecting');
    this.watch();
  },
  watch(){
    if(!this.user||!Tabs.leader)return;
    blurtCloud.watch(this.user.uid,c=>this.onCloud(c),e=>{
      console.error('[Blurt] cloud listener',e);
      this.setStatus('error',e&&e.code==='permission-denied'?'The cloud refused access to your data.':'Lost the connection to the cloud.');
      clearTimeout(this.watchRetry);this.watchRetry=setTimeout(()=>this.watch(),30000);
    });
  },
  onCloud(c){
    if(this.inflight&&c.rev===this.inflight)return; // echo of our own write
    if(this.accountSwitch){this.accountSwitch=false;this.switchAccount(c);return;}
    if(!c.exists||(syncMeta.synced&&c.rev===syncMeta.baseRev)){
      // Cloud is where this device left it (or empty): push anything outstanding.
      if(!c.exists){syncMeta.synced=true;syncMeta.baseRev=null;if(hasContent(state))syncMeta.dirty=true;}
      if(syncMeta.dirty)this.schedule(0);else this.setStatus('synced');
    }else if(!syncMeta.dirty||!hasContent(state))adoptCloud(c);
    else mergeWithCloud(c);
    this.flushSessions();
  },
  // This device holds another account's data: keep it as a backup instead of mixing it in.
  switchAccount(c){
    if(c.exists&&hasContent(c.state)){
      const had=hasContent(state);
      if(had)saveBackup(cloudState(state),'Data from the previously signed-in account');
      adoptCloud(c);
      if(had)toast("Loaded this account's data. What was on this device is saved in Settings › Data & sync.",{ms:9000});
    }else{syncMeta.synced=true;syncMeta.baseRev=c.rev;syncMeta.dirty=true;this.schedule(0);}
  },
  changed(){if(this.user)this.schedule(1500);else renderSyncStatus();},
  schedule(ms){
    if(!this.user||!Tabs.leader)return;

  },
  flush(){if(this.timer&&this.user)this.push();},
  async push(){
    clearTimeout(this.timer);this.timer=null;
    if(!Tabs.leader){Tabs.post({type:'retry'});return;}
    // Nothing goes up until the first cloud read has told us where we stand.
    if(!this.user||!window.blurtCloud||!syncMeta.synced)return;
    if(this.inflight){this.again=true;return;}
    if(!syncMeta.dirty){this.setStatus('synced');return;}
    if(!navigator.onLine){this.setStatus('offline');return;}
    const json=cloudJSON(state);
    if(jsonBytes(json)>CLOUD_LIMIT){this.setStatus('toolarge');return;}
    const rev=uid(),seq=_editSeq;
    this.inflight=rev;this.setStatus('saving');
    try{
      const r=await blurtCloud.push(this.user.uid,{state:JSON.parse(json),rev,savedAt:Date.now(),device:deviceLabel()},syncMeta.baseRev);
      this.inflight=null;
      if(r.conflict){this.onCloud(r.cloud);return;}
      syncMeta.baseRev=rev;
      if(seq===_editSeq)syncMeta.dirty=false;
      this.retryMs=0;persistNow();
      if(syncMeta.dirty||this.again){this.again=false;this.schedule(800);}else this.setStatus('synced');
      this.flushSessions();
    }catch(e){
      this.inflight=null;
      console.error('[Blurt] sync failed',e);
      this.retryMs=Math.min(this.retryMs?this.retryMs*2:3000,60000);
      this.setStatus(navigator.onLine?'error':'offline',e&&e.code==='permission-denied'?'The cloud refused the save.':(e&&e.message)||'');
      this.timer=setTimeout(()=>this.push(),this.retryMs);
    }
  },
  setStatus(s,detail){this.status=s;this.detail=detail||'';renderSyncStatus();Tabs.postStatus();},
  // Study-session summaries queue locally so offline sessions still reach the cloud.
  // Ids let tabs combine their queues without uploading anything twice.
  queueSession(d){d.id=uid();syncMeta.pendingSessions.push(d);syncMeta.pendingSessions=syncMeta.pendingSessions.slice(-200);persistSoon();this.flushSessions();},
  async flushSessions(){

    this.flushing=true;
    try{while(syncMeta.pendingSessions.length){
      const d=syncMeta.pendingSessions[0];await blurtCloud.addSession(this.user.uid,d);
      syncMeta.pendingSessions.shift();
      syncMeta.uploadedSessions=[...(syncMeta.uploadedSessions||[]),d.id].slice(-200);persistSoon();
    }}
    catch(e){console.warn('[Blurt] session upload failed',e);}
    this.flushing=false;
  }
};
window.Sync=Sync;
window.addEventListener('online',()=>{if(Sync.user){if(syncMeta.dirty)Sync.schedule(0);Sync.flushSessions();}renderSyncStatus();});
window.addEventListener('offline',renderSyncStatus);

function cloudState(s){const o=Object.assign({},s);LOCAL_ONLY.forEach(k=>delete o[k]);o.deleted=pruneTombstones(o.deleted);return o;}

function deviceLabel(){

function adoptCloud(c){

// Swap in new content, keeping this device's own UI state.

// Re-render after the data changed underneath the user, without throwing away

function rerenderKeepingDrafts(){

  const drafts={},open=[...document.querySelectorAll('.answer-box.vis,.my-note.vis')].map(e=>e.id);

// ── Merging ──
// Two copies of the data are merged item by item (matched on id). Each item
// keeps the side with the newer `updatedAt` (content) / `noteAt` (my note), with
// this device winning ties; rating histories are combined. `deleted` records
// when items were removed so a merge doesn't bring them back — unless the other
// copy edited the item after it was deleted.
function mergeStates(local,other){
  const deleted=Object.assign({},other.deleted||{});
  Object.entries(local.deleted||{}).forEach(([k,v])=>{deleted[k]=Math.max(deleted[k]||0,v);});
  const out=Object.assign({},other,local);
  out.deleted=pruneTombstones(deleted);
  out.subjects=mergeList(local.subjects,other.subjects,deleted,mergeSubject);

}
function touched(x){return Math.max(x.updatedAt||0,x.noteAt||0);}
function mergeList(a,b,deleted,mergeItem){
  const byId=new Map((b||[]).map(x=>[x.id,x])),seen=new Set(),out=[];
  const alive=x=>!(deleted[x.id]&&deleted[x.id]>=touched(x));
  (a||[]).forEach(x=>{seen.add(x.id);const y=byId.get(x.id);const m=y?mergeItem(x,y,deleted):x;if(alive(m))out.push(m);});
  (b||[]).forEach(y=>{if(!seen.has(y.id)&&alive(y))out.push(y);});
  return out;
}
function newer(x,y){return(y.updatedAt||0)>(x.updatedAt||0)?y:x;}
function mergeSubject(x,y,d){return Object.assign({},newer(x,y),{topics:mergeList(x.topics,y.topics,d,mergeTopic)});}
function mergeTopic(x,y,d){return Object.assign({},newer(x,y),{cards:mergeList(x.cards,y.cards,d,mergeCard),subtopics:mergeList(x.subtopics,y.subtopics,d,mergeSubtopic)});}
function mergeSubtopic(x,y,d){return Object.assign({},newer(x,y),{cards:mergeList(x.cards,y.cards,d,mergeCard)});}
function mergeCard(x,y){
  const n=newer(x,y),note=(y.noteAt||0)>(x.noteAt||0)?y:x;
  return Object.assign({},n,{myNote:note.myNote,noteAt:note.noteAt,confidence:mergeConfidence(x.confidence,y.confidence)});
}
function mergeConfidence(p,q){
  if(!p||!q)return p||q;
  const seen=new Set(),h=[...(p.history||[]),...(q.history||[])].filter(e=>{const k=e.date+e.rating;if(seen.has(k))return false;seen.add(k);return true;}).sort((a,b)=>a.date<b.date?-1:1);
  const full=(p.history||[]).length<HISTORY_CAP&&(q.history||[]).length<HISTORY_CAP;
  const count=r=>full?h.filter(e=>e.rating===r).length:null;
  return{
    lastRating:h.length?h[h.length-1].rating:(p.lastRating||q.lastRating),
    history:h.slice(-HISTORY_CAP),
    timesGot:count('got')??Math.max(p.timesGot||0,q.timesGot||0),
    timesAlmost:count('almost')??Math.max(p.timesAlmost||0,q.timesAlmost||0),
    timesMissed:count('missed')??Math.max(p.timesMissed||0,q.timesMissed||0)
  };
}

// Pasted, dropped and picked images are downscaled and re-encoded (WebP, or
// JPEG where unsupported) so a screenshot costs tens of KB instead of MBs —
// everything has to fit in one ~1 MB cloud document.
const IMG_MAX_SIDE=1400,IMG_QUALITY=0.8,BIG_IMG=120000;
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Unreadable image'));i.src=src;});}
async function compressImage(src){
  const img=await loadImage(src);
  const k=Math.min(1,IMG_MAX_SIDE/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);
  let out=cv.toDataURL('image/webp',IMG_QUALITY);
  if(!out.startsWith('data:image/webp')){ctx.globalCompositeOperation='destination-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);out=cv.toDataURL('image/jpeg',IMG_QUALITY);}
  return src.startsWith('data:')&&out.length>=src.length?src:out;
}
async function insertImageFiles(quill,files,index){
  const imgs=[...files].filter(f=>/^image\//.test(f.type));if(!imgs.length)return;
  let i=index!=null?index:(quill.getSelection(true)||{index:quill.getLength()-1}).index;
  for(const f of imgs){
    const url=URL.createObjectURL(f);
    try{quill.insertEmbed(i,'image',await compressImage(url),'user');i++;}
    catch(e){toast(`Couldn't read ${f.name||'that image'}.`);}
    finally{URL.revokeObjectURL(url);}
  }
  quill.setSelection(i,0,'user');
}

}
const _shrinking=new WeakSet();
// Shrink oversized inline images that arrive inside pasted HTML (e.g. from Word).
async function shrinkEditorImages(quill){
  for(const img of quill.root.querySelectorAll('img')){
    const src=img.getAttribute('src')||'';
    if(!src.startsWith('data:image/')||src.length<=BIG_IMG||_shrinking.has(img))continue;
    _shrinking.add(img);
    try{const out=await compressImage(src);if(out!==src)img.setAttribute('src',out);}catch(e){}
  }
}
function attachImageSupport(quill){
  const imageFiles=dt=>dt?[...(dt.files||[])].filter(f=>/^image\//.test(f.type)):[];
  quill.root.addEventListener('paste',e=>{
    const fs=imageFiles(e.clipboardData);if(!fs.length)return;
    e.preventDefault();e.stopImmediatePropagation();insertImageFiles(quill,fs);

  let count=0,bytes=0,big=0;
  eachCard(state,c=>[c.answer,c.myNote].forEach(h=>{
    if(!h||h.indexOf('data:image/')<0)return;
    (h.match(/src="data:image\/[^"]+"/g)||[]).forEach(m=>{count++;bytes+=m.length;if(m.length>BIG_IMG)big++;});

async function shrinkImages(btn){
  if(btn){btn.disabled=true;btn.textContent='Shrinking…';}
  let saved=0,count=0;const now=Date.now();
  const cards=[];eachCard(state,c=>cards.push(c));
  for(const c of cards){
    for(const field of ['answer','myNote']){
      const html=c[field];if(!html||html.indexOf('data:image/')<0)continue;
      const tpl=document.createElement('template');tpl.innerHTML=html;let changed=false;
      for(const img of tpl.content.querySelectorAll('img')){
        const src=img.getAttribute('src')||'';
        if(!src.startsWith('data:image/')||src.length<=BIG_IMG)continue;
        try{const out=await compressImage(src);if(out.length<src.length){saved+=src.length-out.length;count++;img.setAttribute('src',out);changed=true;}}catch(e){}
      }
      if(changed){c[field]=tpl.innerHTML;if(field==='answer')c.updatedAt=now;else c.noteAt=now;}
    }
  }
  if(count){save();rerenderKeepingDrafts();}
  toast(count?`Shrank ${count} image${count!==1?'s':''}, freeing ${fmtKB(saved)}.`:'None of the images could be made smaller.');

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Answers and notes are stored as HTML, so anything rendered from them goes
// through an allowlist: Quill's own formatting, tables and images survive;
// scripts, event handlers, styles and javascript: links don't. Results are
// cached because renderMain re-renders every card.
const RICH_TAGS=new Set(['P','BR','STRONG','B','EM','I','U','S','STRIKE','SUB','SUP','OL','UL','LI','A','IMG','TABLE','THEAD','TBODY','TR','TH','TD','SPAN','H1','H2','H3','BLOCKQUOTE','PRE','CODE','DIV']);
const DROP_TAGS=new Set(['SCRIPT','STYLE','IFRAME','FRAME','FRAMESET','OBJECT','EMBED','TEMPLATE','SVG','MATH','LINK','META','BASE','FORM','INPUT','BUTTON','TEXTAREA','SELECT','NOSCRIPT','AUDIO','VIDEO','SOURCE','CANVAS']);
const _richCache=new Map();
function safeUrl(u,img){
  u=String(u||'').trim();
  if(img)return/^data:image\/(png|jpe?g|gif|webp|bmp);base64,/i.test(u)||/^https:\/\//i.test(u);
  return/^(https?:|mailto:)/i.test(u);
}
function sanitizeRich(html){
  if(_richCache.has(html))return _richCache.get(html);
  const tpl=document.createElement('template');tpl.innerHTML=html;
  const clean=node=>[...node.childNodes].forEach(ch=>{
    if(ch.nodeType===3)return;
    if(ch.nodeType!==1){ch.remove();return;}
    const tag=ch.tagName.toUpperCase();
    if(DROP_TAGS.has(tag)){ch.remove();return;}
    clean(ch);
    if(!RICH_TAGS.has(tag)){ch.replaceWith(...ch.childNodes);return;}
    [...ch.attributes].forEach(a=>{
      const n=a.name.toLowerCase();let keep=false;
      if(n==='class')keep=a.value.split(/\s+/).every(c=>!c||/^(ql-[\w-]+|blurt-table)$/.test(c));
      else if(n==='href')keep=tag==='A'&&safeUrl(a.value,false);
      else if(n==='src')keep=tag==='IMG'&&safeUrl(a.value,true);
      else if(n==='alt'||n==='width'||n==='height')keep=tag==='IMG';
      else if(n==='colspan'||n==='rowspan')keep=(tag==='TD'||tag==='TH')&&/^\d{1,2}$/.test(a.value);
      if(!keep)ch.removeAttribute(a.name);
    });
    if(tag==='A'){ch.setAttribute('target','_blank');ch.setAttribute('rel','noopener noreferrer');}
  });
  clean(tpl.content);
  nestQuillLists(tpl.content);
  const box=document.createElement('div');box.appendChild(tpl.content);
  const out=box.innerHTML;
  if(_richCache.size>3000)_richCache.clear();
  _richCache.set(html,out);
  return out;
}

// Every list in the app (subjects, topics, subtopics, spec points, study
// setup, sessions, breakdowns) is ordered with these helpers so they always agree.
// Natural order: runs of digits compare as numbers ("Unit 2" < "Unit 10",
// "4.2" < "4.10"), letters ignore case ("3a" < "3B" < "3c").
const NATURAL=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
function naturalCompare(a,b){a=String(a||'');b=String(b||'');return NATURAL.compare(a,b)||(a<b?-1:a>b?1:0);}

// Topic/subtopic names: a leading label such as "Topic", "Unit" or "Chapter" is
// ignored, so "Topic 2" sorts with "1 Atoms" and "Unit 10"; numbered names come
// before unnumbered ones.
const NAME_LABEL=/^\s*(?:topic|unit|chapter|ch\.?|section|sec\.?|module|part|paper|lesson|lecture|week)\s*(?=\d)/i;
function nameKey(name){return String(name||'').replace(NAME_LABEL,'').trim();}
function compareNames(a,b){
  const ka=nameKey(a),kb=nameKey(b),na=/^\d/.test(ka),nb=/^\d/.test(kb);
  if(na!==nb)return na?-1:1;
  return naturalCompare(ka,kb)||naturalCompare(a,b);
}
function sortedTopics(topics){return[...(topics||[])].sort((a,b)=>compareNames(a.name,b.name));}
function sortedSubtopics(subtopics){return sortedTopics(subtopics);}

// When an item was created: the createdAt stamp, or the timestamp uid() puts
// at the front of every id (for items made before createdAt existed).
function createdAt(x){if(x.createdAt)return x.createdAt;const t=parseInt(String(x.id||'').slice(0,8),36);return isFinite(t)?t:0;}
function sortedSubjects(){
  const s=[...state.subjects];
  if(state.sortOrder==='az')s.sort((a,b)=>naturalCompare(a.name,b.name));
  else s.sort((a,b)=>createdAt(b)-createdAt(a)); // 'new': newest first
  return s;
}

// Spec points like "4.2.3": natural order (so 4.10 comes after 4.2).
function compareSpecPoints(a,b){return naturalCompare(String(a).trim(),String(b).trim());}

function getSpecPoints(topic){
  const points=new Set();
  (topic.cards||[]).forEach(c=>{if(c.sp&&c.sp.trim())points.add(c.sp.trim());});
  (topic.subtopics||[]).forEach(st=>{(st.cards||[]).forEach(c=>{if(c.sp&&c.sp.trim())points.add(c.sp.trim());});});
  return[...points].sort(compareSpecPoints);
}

// Order cards by spec point (natural numeric order); cards without a spec
// point keep their original order and sit after the tagged ones.
function sortCardsBySpec(cards){
  return cards.map((c,i)=>[c,i]).sort((a,b)=>{
    const sa=(a[0].sp||'').trim(),sb=(b[0].sp||'').trim();
    if(sa&&sb){const d=compareSpecPoints(sa,sb);return d||a[1]-b[1];}
    if(sa)return-1;
    if(sb)return 1;
    return a[1]-b[1];
  }).map(pair=>pair[0]);
}
