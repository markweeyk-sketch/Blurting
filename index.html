      <span class="subject-name">${esc(s.name)}</span>
      <span class="subject-count">${count}</span>
    </div>`;
  };
  let h=live.map(item).join('');
  if(!live.length)h+='<div style="padding:10px;font-size:12px;color:var(--text3)">All subjects are archived</div>';
  if(arch.length)h+=`<button class="archived-toggle" onclick="toggleArchivedList()"><span>${state.showArchived?'▾':'▸'}</span> Archived (${arch.length})</button>`+(state.showArchived?arch.map(item).join(''):'');
  el.innerHTML=h;
}

function allCards(t){let c=[...(t.cards||[])];(t.subtopics||[]).forEach(st=>c=c.concat(st.cards||[]));return c;}
function openSubject(id){
  state.activeSubId = id;
  state.activeTopicId = null;
  state.activeSpFilter = null;
  state.activeSubtopicSpFilters = {};
  if(isNarrow()){state.sidebarOpen=false;applySidebar();}
  saveUI();
  renderSidebar();
  renderMain();
}
function renderMain(){
  const sub=state.subjects.find(s=>s.id===state.activeSubId);
  if(!sub){document.getElementById('mainContent').innerHTML='<div class="empty"><div class="empty-title">Subject not found</div></div>';return;}
  const topics=sub.topics||[];
  const totalCards=topics.reduce((a,t)=>a+allCards(t).length,0);
  const notedCards=topics.reduce((a,t)=>a+allCards(t).filter(c=>c.myNote&&c.myNote.trim()).length,0);
  const ts=sortedTopics(topics);
  document.getElementById('topbarTitle').textContent=sub.name;
  document.getElementById('topbarSub').textContent=`${topics.length} topic${topics.length!==1?'s':''} · ${totalCards} card${totalCards!==1?'s':''}`;
  document.getElementById('topbarActions').innerHTML=`
    <button class="btn btn-sm btn-primary" onclick="openStudySetup()">Study</button>
    <button class="btn btn-sm" onclick="openPanel('topic')">+ Topic</button>
    <button class="btn btn-sm" onclick="openPanel('subject','${sub.id}')">Edit</button>
    <button class="btn btn-sm btn-danger" onclick="deleteSubject('${sub.id}')">Delete</button>`;
  if(!topics.length){document.getElementById('mainContent').innerHTML=`<div class="empty"><div class="empty-title">No topics yet</div><div class="empty-sub">Add a topic to start creating revision cards.</div><button class="btn btn-primary" onclick="openPanel('topic')">Add first topic</button></div>`;return;}

  const shown=state.activeTopicId?ts.filter(t=>t.id===state.activeTopicId):ts;

  // Collect all spec points from shown topics for global search
  const allSpSet=new Set();
  shown.forEach(t=>getSpecPoints(t).forEach(sp=>allSpSet.add(sp)));
  const allSps=[...allSpSet].sort(compareSpecPoints);

  let html=(sub.archived?`<div class="archived-banner"><span>📦 This subject is archived, so it's hidden from your main subject list.</span><span class="spacer"></span><button class="btn btn-sm" onclick="toggleArchive('${sub.id}')">Unarchive</button></div>`:'')+`<div class="stats-row">
    <div class="stat-card"><div class="stat-n">${topics.length}</div><div class="stat-l">Topics</div></div>
    <div class="stat-card"><div class="stat-n">${totalCards}</div><div class="stat-l">Cards</div></div>
    <div class="stat-card"><div class="stat-n">${notedCards}</div><div class="stat-l">My notes</div></div>
  </div>
  <div class="tab-bar">
    <button class="tab${!state.activeTopicId?' active':''}" onclick="setTopic(null)">All</button>
    ${ts.map(t=>`<button class="tab${state.activeTopicId===t.id?' active':''}" onclick="setTopic('${t.id}')">${esc(t.name)}</button>`).join('')}
  </div>`;

  // Global spec point search
  if(allSps.length>0){
    html+=`<div class="spec-search-bar">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" style="flex-shrink:0;color:var(--text3)"><circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M9 9l2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <input
        class="spec-search-input"
        type="text"
        placeholder="Search spec point e.g. 1.1"
        value="${escAttr(state.activeSpFilter||'')}"
        oninput="setSpFilter(this.value)"
      >
      ${state.activeSpFilter?`<button class="spec-search-clear" onclick="setSpFilter(null)">✕</button>`:''}
    </div>`;
  }

  shown.forEach(t=>{
    const sts=sortedSubtopics(t.subtopics||[]);
    const allC=allCards(t);
    const notedC=allC.filter(c=>c.myNote&&c.myNote.trim()).length;
    const pct=allC.length?Math.round(notedC/allC.length*100):0;
    const filteredDc=sortCardsBySpec((t.cards||[]).filter(c=>!state.activeSpFilter||(c.sp||'').trim()===state.activeSpFilter.trim()));

    html+=`<div class="topic-block"><div class="topic-header"><span class="topic-label">${esc(t.name)}</span><div class="topic-actions">
      <button class="btn btn-sm" onclick="openPanel('subtopic',null,'${t.id}')">+ Subtopic</button>
      <button class="btn btn-sm" onclick="openPanel('card',null,'${t.id}',null)">+ Card</button>
      <button class="btn btn-sm" onclick="openBulk('${t.id}',null)">Bulk add</button>
      <button class="btn btn-sm" onclick="openPanel('topic','${t.id}')">Edit</button>
      <button class="btn btn-sm btn-danger" onclick="deleteTopic('${t.id}')">Delete</button>
    </div></div>`;

    if(allC.length)html+=`<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-label">${notedC} of ${allC.length} cards with your notes · ${pct}%</div></div>`;

    if(sts.length){
      html+=`<div class="subtopic-list">`;
      sts.forEach(st=>{
        const stSpFilter=getSubtopicSpFilter(st.id);
        const scAll=st.cards||[];
        // Apply both global and subtopic-level filter
        const sc=sortCardsBySpec(scAll.filter(c=>{
          const globalMatch=!state.activeSpFilter||(c.sp||'').trim()===state.activeSpFilter.trim();
          const localMatch=!stSpFilter||(c.sp||'').trim()===stSpFilter.trim();
          return globalMatch&&localMatch;
        }));
        const sn=scAll.filter(c=>c.myNote&&c.myNote.trim()).length;
        const sp=scAll.length?Math.round(sn/scAll.length*100):0;

        // Get spec points for this subtopic only
        const stSps=[...new Set(scAll.filter(c=>c.sp&&c.sp.trim()).map(c=>c.sp.trim()))].sort(compareSpecPoints);

        html+=`<div class="subtopic-row" id="st-${st.id}">
          <div class="subtopic-header" onclick="toggleSubtopic('${st.id}')">
            <span class="subtopic-chevron">▶</span>
            <span class="subtopic-name">${esc(st.name)}</span>
            <span class="subtopic-count">${scAll.length} card${scAll.length!==1?'s':''} · ${sp}%</span>
          </div>
          <div class="subtopic-body">
            ${scAll.length?`<div class="progress-wrap" style="padding:8px 2px 4px"><div class="progress-bar"><div class="progress-fill" style="width:${sp}%"></div></div><div class="progress-label">${sn} of ${scAll.length} noted</div></div>`:''}
            ${stSps.length>0?`<div class="subtopic-filter-bar">
              <button class="subtopic-chip${!stSpFilter?' active':''}" onclick="setSubtopicSpFilter('${st.id}',null)">All</button>
              ${stSps.map(s=>`<button class="subtopic-chip${stSpFilter===s?' active':''}" onclick="setSubtopicSpFilter('${st.id}','${escAttr(jsStr(s))}')">${esc(s)}</button>`).join('')}
            </div>`:''}
            ${sc.length?`<div class="cards-grid">${sc.map(c=>cardHTML(t.id,c,st.id)).join('')}</div>`
              :(stSpFilter||state.activeSpFilter)?`<div style="font-size:12px;color:var(--text3);padding:8px 2px">No cards match this spec point.</div>`
              :`<div class="dashed-add" onclick="openPanel('card',null,'${t.id}','${st.id}')">+ Add first card to this subtopic</div>`}
          </div>
          <div class="subtopic-actions">
            <button class="btn btn-sm" onclick="openPanel('card',null,'${t.id}','${st.id}')">+ Card</button>
            <button class="btn btn-sm" onclick="openBulk('${t.id}','${st.id}')">Bulk add</button>
            <button class="btn btn-sm" onclick="openPanel('subtopic','${st.id}','${t.id}')">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="deleteSubtopic('${t.id}','${st.id}')">Delete subtopic</button>
          </div>
        </div>`;
      });
      html+=`</div>`;
    }

    if(filteredDc.length){
      if(sts.length)html+=`<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin:10px 0 8px">General cards</div>`;
      html+=`<div class="cards-grid">${filteredDc.map(c=>cardHTML(t.id,c,null)).join('')}</div>`;
    } else if(!sts.length&&!state.activeSpFilter){
      html+=`<div class="dashed-add" onclick="openPanel('card',null,'${t.id}',null)">+ Add first card to this topic</div>`;
    } else if(!sts.length&&state.activeSpFilter){
      html+=`<div style="font-size:12px;color:var(--text3);padding:8px 2px">No cards match this spec point.</div>`;
    }

    html+=`</div>`;
  });

  html+=buildWeakAreasHTML(sub);

  document.getElementById('mainContent').innerHTML=html;
  (state.openSubtopics||[]).forEach(id=>{const el=document.getElementById('st-'+id);if(el)el.classList.add('open');});
  initBlurtEditors();
  if(_kbCard)setCardFocus(_kbCard,false);
}

function buildWeakAreasHTML(sub){
  // One row per section, built in display order so ties keep the page's order.
  const arr=[];
  const tally=(cards,name)=>{
    const g={name,got:0,almost:0,missed:0};
    (cards||[]).forEach(c=>{const r=c.confidence&&c.confidence.lastRating;if(r==='got'||r==='almost'||r==='missed')g[r]++;});
    if(g.got+g.almost+g.missed)arr.push(g);
  };
  sortedTopics(sub.topics).forEach(t=>{
    const sts=sortedSubtopics(t.subtopics);
    sts.forEach(st=>tally(st.cards,st.name));
    tally(t.cards,sts.length?t.name+' · general':t.name);
  });
  if(!arr.length)return'';
  // Weakest first: a miss counts fully, an "almost" half.
  const weakness=g=>(g.missed+g.almost/2)/(g.got+g.almost+g.missed);
  arr.sort((a,b)=>weakness(b)-weakness(a));
  let h=`<div class="weak-areas-section"><div class="weak-areas-title">Weak areas</div>`;
  arr.forEach(g=>{
    const tot=g.got+g.almost+g.missed;
    const gotPct=tot?Math.round(g.got/tot*100):0;
    h+=`<div class="weak-row">
      <span class="weak-name">${esc(g.name)}</span>
      <div class="weak-pills">
        ${g.got?`<span class="weak-pill got">${g.got} got</span>`:''}
        ${g.almost?`<span class="weak-pill almost">${g.almost} almost</span>`:''}
        ${g.missed?`<span class="weak-pill missed">${g.missed} missed</span>`:''}
      </div>
      <div class="weak-bar-wrap"><div class="weak-bar"><div class="weak-bar-fill" style="width:${gotPct}%;background:var(--green)"></div></div></div>
    </div>`;
  });
  return h+`</div>`;
}
function toggleSubtopic(id){
  const el=document.getElementById('st-'+id);if(!el)return;
  el.classList.toggle('open');
  if(!state.openSubtopics)state.openSubtopics=[];
  if(el.classList.contains('open'))state.openSubtopics.push(id);
  else state.openSubtopics=state.openSubtopics.filter(x=>x!==id);
  saveUI();
}

function confDot(c){
  try{
    const r=c.confidence?.lastRating;
    if(!r)return'';
    const labels={got:'Got it',almost:'Almost',missed:'Missed it'};
    return`<span class="conf-dot ${r}" title="${labels[r]||r}"></span>`;
  }catch(e){return'';}
}

function cardHTML(tid,c,stid){
  const hasNote=c.myNote&&c.myNote.trim();
  const dot=confDot(c);
  const showSpRow=!!(c.sp||dot);
  return`<div class="card${_kbCard===c.id?' kb-focus':''}" id="card-${c.id}" onmousedown="setCardFocus('${c.id}')">
    ${showSpRow?`<div class="card-sp">${c.sp?esc(c.sp):''}${dot}</div>`:''}
    <div class="card-q">${esc(c.q)}</div>
    ${c.hint?`<div class="card-hint">${esc(c.hint)}</div>`:''}
    <div class="blurt-field" id="bq-${c.id}" data-cid="${c.id}"></div>
    <div class="card-actions">
      <button class="card-btn" id="ans-btn-${c.id}" onclick="toggleAnswer('${c.id}')">Show answer</button>
      ${hasNote?`<button class="card-btn green" onclick="toggleNote('${c.id}')">My note</button>`:''}
      <button class="card-btn green" onclick="saveNote('${tid}','${c.id}','${stid||''}')">Save note</button>
      <button class="card-btn" onclick="openPanel('card','${c.id}','${tid}','${stid||''}')">Edit</button>
      <button class="card-btn red" onclick="deleteCard('${tid}','${c.id}','${stid||''}')">Delete</button>
    </div>
    <div class="answer-box rich" id="ans-${c.id}">${c.answer?renderAnswer(c.answer):''}</div>
    ${hasNote?`<div class="my-note" id="note-${c.id}"><div class="my-note-label">My note</div><div class="my-note-text rich">${renderAnswer(c.myNote)}</div></div>`:''}
  </div>`;
}

function toggleAnswer(id){const a=document.getElementById('ans-'+id),b=document.getElementById('ans-btn-'+id);if(!a)return;a.classList.toggle('vis');b.textContent=a.classList.contains('vis')?'Hide answer':'Show answer';}
function toggleNote(id){const n=document.getElementById('note-'+id);if(n)n.classList.toggle('vis');}

function saveNote(tid,cid,stid){
  const quill=_blurtQuills[cid];if(!quill)return;
  const html=quill.root.innerHTML;
  if(!quill.getText().trim()&&!quill.root.querySelector('table'))return;
  const c=findCard(tid,cid,stid);if(!c)return;
  c.myNote=html;c.noteAt=Date.now();save();
  const noteEl=document.getElementById('note-'+cid);
  if(noteEl){noteEl.querySelector('.my-note-text').innerHTML=renderAnswer(c.myNote);noteEl.classList.add('vis');}
  else{
    const card=document.getElementById('card-'+cid);
    const nd=document.createElement('div');nd.className='my-note vis';nd.id='note-'+cid;
    nd.innerHTML=`<div class="my-note-label">My note</div><div class="my-note-text rich">${renderAnswer(c.myNote)}</div>`;
    card.appendChild(nd);
    const acts=card.querySelector('.card-actions');
    if(!acts.querySelector('.card-btn.green[onclick*="toggleNote"]')){
      const b=document.createElement('button');b.className='card-btn green';b.textContent='My note';
      b.setAttribute('onclick',`toggleNote('${cid}')`);acts.insertBefore(b,acts.children[1]);
    }
  }
}

function findCard(tid,cid,stid){
  const sub=state.subjects.find(s=>s.id===state.activeSubId);if(!sub)return null;
  const t=sub.topics.find(t=>t.id===tid);if(!t)return null;
  if(stid){const st=(t.subtopics||[]).find(st=>st.id===stid);return st?(st.cards||[]).find(c=>c.id===cid):null;}
  return(t.cards||[]).find(c=>c.id===cid);
}

function setTopic(id){
  state.activeTopicId = id;
  state.activeSpFilter = null;
  state.activeSubtopicSpFilters = {};
  renderMain();
}


function openPanel(type,editId,topicId,subtopicId){
  if(_closeTimer){clearTimeout(_closeTimer);_closeTimer=null;}
  panel.type=type;panel.editId=editId||null;panel.topicId=topicId||null;panel.subtopicId=subtopicId||null;
  if(type==='subject')buildSubjectPanel(editId);
  else if(type==='topic')buildTopicPanel(editId);
  else if(type==='subtopic')buildSubtopicPanel(editId,topicId);
  else if(type==='card')buildCardPanel(editId,topicId,subtopicId);
  const bd=document.getElementById('panelBackdrop');
  bd.classList.add('open');
  bd.addEventListener('click',_backdropClick);
  const body=document.getElementById('panelBody');
  body.onkeydown=_panelKeydown;
  // Stop Chrome from offering autofill / form-history suggestions on the fields.
  body.querySelectorAll('input').forEach(i=>{
    i.setAttribute('autocomplete','off');
    i.setAttribute('autocorrect','off');
    i.setAttribute('autocapitalize','off');
    i.setAttribute('spellcheck','false');
  });
  setTimeout(()=>{const f=body.querySelector('input:not([type=hidden]),textarea');if(f)f.focus();},320);
}

function _savePanel(){
  if(panel.type==='subject')saveSubject();
  else if(panel.type==='topic')saveTopic();
  else if(panel.type==='subtopic')saveSubtopic();
  else if(panel.type==='card')saveCard();
}

// Ordered list of navigable fields in the panel (inputs, then the answer editor).
function _panelFields(){
  const body=document.getElementById('panelBody');
  const fields=[...body.querySelectorAll('input.field-input')];
  const ed=body.querySelector('#p-ans-editor .ql-editor');
  if(ed)fields.push(ed);
  return fields;
}

// Enter saves the panel; Up/Down arrows move between fields.
function _panelKeydown(e){
  if(e.target.tagName!=='INPUT')return;
  if(e.key==='Enter'){e.preventDefault();_savePanel();return;}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    const fields=_panelFields();
    const i=fields.indexOf(e.target);
    const ni=e.key==='ArrowDown'?i+1:i-1;
    if(i===-1||ni<0||ni>=fields.length)return;
    e.preventDefault();
    const next=fields[ni];
    if(next.classList.contains('ql-editor')&&_answerQuill)_answerQuill.focus();
    else next.focus();
  }
}

function closePanel(){
  const bd=document.getElementById('panelBackdrop');
  bd.classList.remove('open');
  bd.removeEventListener('click',_backdropClick);
}

function _backdropClick(e){if(e.target===document.getElementById('panelBackdrop'))closePanel();}
function setPanelColor(c){panel.selColor=c;document.querySelectorAll('.color-swatch').forEach(s=>s.classList.toggle('sel',s.dataset.color===c));}

function buildTopicPanel(editId){

function buildSubtopicPanel(editId,topicId){
  const sub=activeSubject();

function buildCardPanel(editId,topicId,subtopicId){
  const sub=state.subjects.find(s=>s.id===state.activeSubId);
  const t=sub&&sub.topics.find(t=>t.id===topicId);
  const st=subtopicId&&t?(t.subtopics||[]).find(st=>st.id===subtopicId):null;
  const pool=st?st.cards:t&&t.cards||[];
  const c=editId?pool.find(c=>c.id===editId):null;
  document.getElementById('panelTitle').textContent=c?'Edit card':'New card';
  document.getElementById('panelBody').innerHTML=`
    <div class="field"><label class="field-label">Spec point <span style="opacity:.5;font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input class="field-input" id="p-sp" placeholder="e.g. SP 3.1.2" value="${c?esc(c.sp||''):''}"></div>
    <div class="field"><label class="field-label">Question</label>
      <input class="field-input" id="p-q" placeholder="e.g. What does the ALU do?" value="${c?esc(c.q||''):''}"></div>
    <div class="field"><label class="field-label">Hint <span style="opacity:.5;font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input class="field-input" id="p-hint" placeholder="e.g. Think: arithmetic and logic..." value="${c?esc(c.hint||''):''}"></div>
    <div class="field"><label class="field-label">Model answer</label>

// asCopy: add a new card from the form and leave the original untouched.
function saveCard(asCopy){
  const q=v('p-q');if(!q.trim())return;
  const here=`${state.activeSubId}|${panel.topicId}|${panel.subtopicId||''}`,loc=v('p-loc')||here;
  const src=resolveList(parseLoc(here)),dest=resolveList(parseLoc(loc));if(!dest)return;
  const rawAns=_answerQuill?_answerQuill.root.innerHTML:'';
  const answer=(rawAns==='<p><br></p>'||!rawAns)?'':rawAns;
  const now=Date.now(),fields={sp:v('p-sp'),q:q.trim(),hint:v('p-hint'),answer,updatedAt:now};
  let focus;
  if(panel.editId&&asCopy!==true){
    const c=src&&src.find(c=>c.id===panel.editId);if(!c)return;
    Object.assign(c,fields);focus=c.id;
    if(dest!==src)focus=moveItem(src,c,dest).id;
  }else{
    const c=Object.assign({id:uid(),myNote:'',createdAt:now},fields);
    const i=asCopy===true&&dest===src?src.findIndex(x=>x.id===panel.editId):-1;
    if(i>=0)dest.splice(i+1,0,c);else dest.push(c);
    focus=c.id;
  }
  save();closePanel();renderSidebar();renderMain();
  const ds=parseLoc(loc).sub;
  if(ds!==state.activeSubId)toast(`${asCopy===true?'Copied':panel.editId?'Moved':'Added'} to ${clip(subjectName(ds),40)}.`,{action:{label:'Go there',fn:()=>openSubject(ds)}});

// Default keyboard shortcuts for the editors. Each hotkey stores the key code
// (for Quill matching), a display char, and which modifiers must be held.
function defaultHotkeys(){
  const k=key=>({key,code:null,shortKey:false,shiftKey:false,altKey:false});
  return{
    bulletList:{code:56,key:'8',shortKey:true,shiftKey:true,altKey:false},
    orderedList:{code:55,key:'7',shortKey:true,shiftKey:true,altKey:false},
    insertTable:{code:84,key:'T',shortKey:true,shiftKey:false,altKey:true},
    search:k('/'),newCard:k('n'),bulkAdd:k('b'),study:k('s'),nextCard:k('j'),prevCard:k('k'),
    toggleAnswer:k('a'),writeBlurt:k('w'),editCard:k('e'),toggleSidebar:k('['),showHelp:k('?'),
    reveal:k(' '),rateGot:k('1'),rateAlmost:k('2'),rateMissed:k('3')

}
function hkToBinding(hk){const h=hk||{};return{key:h.code,shortKey:!!h.shortKey,shiftKey:!!h.shiftKey,altKey:!!h.altKey};}
const KEY_NAMES={' ':'Space',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Escape:'Esc',Delete:'Del'};
function hotkeyLabel(hk){
  if(!hk||!hk.key)return'—';
  const isMac=/Mac|iPhone|iPad/i.test(navigator.platform||navigator.userAgent);
  const parts=[];
  if(hk.shortKey)parts.push(isMac?'Cmd':'Ctrl');
  if(hk.altKey)parts.push(isMac?'Option':'Alt');
  if(hk.shiftKey)parts.push('Shift');
  parts.push(KEY_NAMES[hk.key]||(hk.key.length===1?hk.key.toUpperCase():hk.key));
  return parts.join('+');

// Shared Quill keyboard bindings: Enter runs onEnter (save), Shift+Enter makes a
// new line, and the configurable list shortcuts toggle bullet & numbered lists.
function editorBindings(onEnter,onArrowUpTop){
  const hk=state.hotkeys||defaultHotkeys();
  const b={
    saveEnter:{key:13,shiftKey:false,handler:function(){if(onEnter)onEnter();return false;}},
    bulletList:Object.assign(hkToBinding(hk.bulletList),{handler:function(range,context){this.quill.format('list',context.format.list==='bullet'?false:'bullet','user');return false;}}),
    orderedList:Object.assign(hkToBinding(hk.orderedList),{handler:function(range,context){this.quill.format('list',context.format.list==='ordered'?false:'ordered','user');return false;}}),
    insertTable:Object.assign(hkToBinding(hk.insertTable),{handler:function(){openInsertTable(this.quill);return false;}})
  };
  // ArrowUp at the very start of the editor jumps back up to the field above.
  if(onArrowUpTop)b.exitUp={key:38,handler:function(range){if(range&&range.index===0&&range.length===0){onArrowUpTop();return false;}return true;}};
  return b;
}

let _hkRecordHandler=null;

  if(!state.hotkeys)state.hotkeys=defaultHotkeys();
  document.getElementById('settingsHotkeyRows').innerHTML=`<div class="settings-text">Click a shortcut, then press the keys you want. Esc cancels.</div>`+HOTKEY_GROUPS.map(g=>`
    <div class="settings-section" style="margin-top:18px">${g.title}</div><div class="settings-text">${g.text}</div>
    ${Object.entries(HOTKEYS).filter(([,d])=>d.scope===g.scope).map(([k,d])=>`
      <div class="hotkey-row"><div><div class="hotkey-name">${d.label}</div>${d.desc?`<div class="hotkey-desc">${d.desc}</div>`:''}</div>
      <button class="hotkey-btn" id="hk-${k}" onclick="startRecordHotkey('${k}',this)">${esc(hotkeyLabel(state.hotkeys[k]))}</button></div>`).join('')}`).join('')

function sameHotkey(a,b){return!!a&&!!b&&normKey(a.key)===normKey(b.key)&&!!a.shortKey===!!b.shortKey&&!!a.altKey===!!b.altKey&&!!a.shiftKey===!!b.shiftKey;}
function resetAllHotkeys(){state.hotkeys=defaultHotkeys();save();renderHotkeyRows();if(state.activeSubId&&!_session)rerenderKeepingDrafts();}
function startRecordHotkey(which,btn){
  cancelRecordHotkey();
  document.querySelectorAll('.hotkey-btn').forEach(b=>b.classList.remove('recording'));
  const scope=HOTKEYS[which].scope;
  btn.textContent='Press keys…';btn.classList.add('recording');
  _hkRecordHandler=function(e){
    if(['Shift','Control','Alt','Meta','CapsLock','Tab'].includes(e.key))return;
    e.preventDefault();e.stopPropagation();
    if(e.key==='Escape'){cancelRecordHotkey();renderHotkeyRows();return;}
    if(scope==='editor'&&!(e.ctrlKey||e.metaKey||e.altKey)){btn.textContent='Add Ctrl / Cmd / Alt…';return;}
    if(scope!=='editor'&&(e.ctrlKey||e.metaKey)&&!e.altKey&&normKey(e.key)==='k'){btn.textContent='Ctrl/Cmd+K is search';return;}
    const hk=scope==='editor'
      ?{code:e.keyCode,key:e.key.length===1?e.key.toUpperCase():e.key,shortKey:e.ctrlKey||e.metaKey,shiftKey:e.shiftKey,altKey:e.altKey}
      :{code:null,key:normKey(e.key),shortKey:e.ctrlKey||e.metaKey,shiftKey:e.shiftKey&&/^[a-z]$/i.test(e.key),altKey:e.altKey};
    const clash=Object.entries(HOTKEYS).find(([k,d])=>k!==which&&d.scope===scope&&sameHotkey(state.hotkeys[k],hk));
    if(clash){btn.textContent=`Already “${clash[1].label}”`;return;}
    state.hotkeys[which]=hk;
    save();cancelRecordHotkey();renderHotkeyRows();
    if(state.activeSubId&&!_session)rerenderKeepingDrafts();
  };
  document.addEventListener('keydown',_hkRecordHandler,true);
}
function cancelRecordHotkey(){
  if(_hkRecordHandler){document.removeEventListener('keydown',_hkRecordHandler,true);_hkRecordHandler=null;}
}

// Find which topic/subtopic a card belongs to within the active subject.
function locateCard(cid){
  const sub=state.subjects.find(s=>s.id===state.activeSubId);if(!sub)return null;
  for(const t of (sub.topics||[])){
    if((t.cards||[]).some(c=>c.id===cid))return{tid:t.id,stid:null};
    for(const st of (t.subtopics||[])){
      if((st.cards||[]).some(c=>c.id===cid))return{tid:t.id,stid:st.id};
    }
  }
  return null;
}

// ---- Tables ----
// Quill 1 has no table format, so a table is a single block embed. It isn't
// editable in place: clicking it opens the table editor. Cells hold sanitized
// HTML (sub/sup/bold/italic/line breaks only), so pasted formulas keep their
// subscripts but nothing else from the source page survives.
const TABLE_CELL_TAGS={SUB:1,SUP:1,B:1,STRONG:1,I:1,EM:1};
function escAttr(s){return esc(s).replace(/"/g,'&quot;');}
function sanitizeCell(html){
  const tpl=document.createElement('template');tpl.innerHTML=html||'';
  const walk=n=>{let out='';n.childNodes.forEach(ch=>{
    if(ch.nodeType===3){out+=esc(ch.nodeValue.replace(/\s+/g,' '));return;}
    if(ch.nodeType!==1||/^(SCRIPT|STYLE|TEMPLATE)$/.test(ch.tagName))return;
    const t=ch.tagName;
    if(t==='BR'){out+='<br>';return;}
    const inner=walk(ch);
    if(TABLE_CELL_TAGS[t]){const tag=t.toLowerCase();out+=`<${tag}>${inner}</${tag}>`;}
    else if(/^(P|DIV|LI)$/.test(t))out+=(out&&!/<br>\s*$/.test(out)?'<br>':'')+inner;
    else out+=inner;
  });return out;};
  return walk(tpl.content).replace(/^(\s|<br>)+|(\s|<br>)+$/g,'');
}
function normTable(d){
  const rows=((d&&d.rows)||[]).map(r=>r.map(c=>String(c==null?'':c)));
  const cols=Math.max(1,...rows.map(r=>r.length));
  rows.forEach(r=>{while(r.length<cols)r.push('');});
  return{header:!!(d&&d.header),rows:rows.length?rows:[Array(cols).fill('')]};
}
function fillTableNode(node,value){
  const d=normTable(value);
  node.setAttribute('contenteditable','false');
  node.innerHTML='';
  const body=document.createElement('tbody');
  d.rows.forEach((r,ri)=>{
    const tr=document.createElement('tr');
    r.forEach(c=>{const cell=document.createElement(d.header&&ri===0?'th':'td');cell.innerHTML=sanitizeCell(c);tr.appendChild(cell);});
    body.appendChild(tr);
  });
  node.appendChild(body);
}
// Reads Blurt's own tables and arbitrary pasted HTML tables alike.
function readTableNode(node){
  const rows=[...node.querySelectorAll('tr')].filter(tr=>tr.closest('table')===node)
    .map(tr=>[...tr.children].filter(c=>c.tagName==='TD'||c.tagName==='TH').map(c=>sanitizeCell(c.innerHTML)))
    .filter(r=>r.length);
  const first=node.querySelector('tr');
  const header=!!node.querySelector('thead')||!!(first&&first.children.length&&[...first.children].every(c=>c.tagName==='TH'));
  return normTable({header,rows});
}
const BlockEmbed=Quill.import('blots/block/embed');
class TableBlot extends BlockEmbed{
  static create(value){const node=super.create(value);fillTableNode(node,value);return node;}
  static value(node){return readTableNode(node);}
}
TableBlot.blotName='table';TableBlot.tagName='table';TableBlot.className='blurt-table';
Quill.register(TableBlot);
Quill.import('ui/icons').table='<svg viewBox="0 0 18 18"><rect class="ql-stroke" x="3" y="3" width="12" height="12" rx="1"/><line class="ql-stroke" x1="3" x2="15" y1="7" y2="7"/><line class="ql-stroke" x1="3" x2="15" y1="11" y2="11"/><line class="ql-stroke" x1="9" x2="9" y1="7" y2="15"/></svg>';

function reflowCells(flat,n){
  const rows=[];
  for(let i=0;i<flat.length;i+=n){const r=flat.slice(i,i+n);while(r.length<n)r.push('');rows.push(r);}
  return rows.length?rows:[Array(n).fill('')];
}

// Spot a table in pasted plain text. Handles tab-separated rows (spreadsheets,
// Word) and one-cell-per-paragraph text like tables copied from revision
// sites: a short header run ("Mixture", "Products", ...) sets the column count.
// Returns null for ordinary prose so normal pastes are left alone.
function tableFromPlainText(text){
  const t=(text||'').replace(/\r\n?/g,'\n').replace(/ /g,' ');
  const lines=t.split('\n').filter(l=>l.trim());
  if(lines.length>=2&&lines.every(l=>l.includes('\t'))){
    return{rows:lines.map(l=>l.split('\t').map(c=>esc(c.trim()))),title:''};
  }
  const blocks=t.split(/\n[ \t]*\n/).map(b=>b.trim()).filter(Boolean);
  if(blocks.length<6)return null;
  let title='';const cells=blocks.slice();
  const first=cells[0].split('\n').map(s=>s.trim()).filter(Boolean);
  if(first.length>1){title=first.slice(0,-1).join(' ');cells[0]=first[first.length-1];}
  if(cells.some(c=>c.includes('\n')||c.length>300))return null;
  const headerRun=a=>{let h=0;while(h<a.length&&h<8&&a[h].length<=40&&!/[.!?]$/.test(a[h]))h++;return h;};
  const fits=(a,n)=>n>=2&&n<=8&&a.length%n===0&&a.length/n>=2;
  // A header run that ends at a longer cell (not at the cap) still looks tabular
  // even when the cell count doesn't divide evenly — e.g. a missing cell.
  const endsAtBody=(a,n)=>n>=2&&n<=6&&n<a.length&&a.length>=n*2;
  const h=headerRun(cells);
  if(fits(cells,h))return{flat:cells.map(esc),cols:h,title};
  // Title pasted as its own paragraph: it only lines up once it's set aside.
  // A real title is longer than the column headers beneath it.
  if(!title){
    const rest=cells.slice(1),h2=headerRun(rest);
    if(fits(rest,h2)&&cells[0].length>Math.max(...rest.slice(0,h2).map(c=>c.length)))
      return{flat:rest.map(esc),cols:h2,title:cells[0]};
  }
  if(endsAtBody(cells,h))return{flat:cells.map(esc),cols:h,title};
  return null;
}

// Insert a table (and optional bold heading line) at index, on its own line.
function insertTableInto(q,index,data,title){
  let i=Math.max(0,Math.min(index,q.getLength()-1));
  const [,offset]=q.getLine(i);
  if(offset>0){q.insertText(i,'\n','user');i++;}
  if(title){q.insertText(i,title+'\n',{bold:true},'user');i+=title.length+1;}
  q.insertEmbed(i,'table',data,'user');
  q.setSelection(i+1,0,'user');
}

// Table editor modal — one dialog for inserting, editing, and confirming a paste.
let _tbl=null;
function ensureTableModal(){

  document.body.appendChild(m);
  m.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();cancelTableEditor(false);}
    else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();e.stopPropagation();confirmTableEditor();}
  });
  m.addEventListener('mousedown',e=>{if(e.target===m)cancelTableEditor(false);});
  // Pasting into a cell takes plain text only.
  m.addEventListener('paste',e=>{
    if(!(e.target.closest&&e.target.closest('.tm-cell')))return;
    e.preventDefault();
    document.execCommand('insertText',false,(e.clipboardData.getData('text/plain')||'').replace(/\r\n?/g,'\n'));

  return m;
}
function openTableEditor(o){

        return`<${tag}><div class="tm-cell" contenteditable="true" data-r="${ri}" data-c="${ci}">${sanitizeCell(c)}</div></${tag}>`;
      }).join('')}</tr>`).join('')}</tbody></table></div>

function syncTableEditor(){
  const m=document.getElementById('tableModal');if(!m||!_tbl)return;
  m.querySelectorAll('.tm-cell').forEach(el=>{

function tableEditorCols(d){

  if(n===cols)return;
  if(t.reflow){const flat=[].concat(...t.rows);while(flat.length&&!flat[flat.length-1])flat.pop();t.rows=reflowCells(flat,n);}
  else if(d>0)t.rows.forEach(r=>r.push(''));
  else t.rows.forEach(r=>r.pop());
  renderTableEditor();
}
function tableEditorRows(d){

// Wire paste detection and click-to-edit into an editor.
function attachTableSupport(quill){
  quill.root.addEventListener('paste',e=>{
    const cd=e.clipboardData;if(!cd)return;
    // HTML tables (websites, spreadsheets) are converted by Quill's own paste,
    // which maps <table> onto TableBlot.
    if(/<table[\s>]/i.test(cd.getData('text/html')||''))return;
    const plain=cd.getData('text/plain');
    const guess=tableFromPlainText(plain);
    if(!guess)return;
    e.preventDefault(); // Quill's paste handler skips defaultPrevented events
    const range=quill.getSelection(true)||{index:quill.getLength()-1,length:0};
    if(range.length)quill.deleteText(range.index,range.length,'user');
    openTableEditor(Object.assign({mode:'paste',quill,index:range.index,plain},guess));
  },true);
  quill.root.addEventListener('click',e=>{
    const tbl=e.target.closest&&e.target.closest('table.blurt-table');
    if(!tbl||!quill.root.contains(tbl))return;
    const blot=Quill.find(tbl);if(!blot)return;
    openTableEditor({mode:'edit',quill,index:blot.offset(quill.scroll),data:readTableNode(tbl)});
  });
}

function openStudySetup(){
  const sub=state.subjects.find(s=>s.id===state.activeSubId);if(!sub)return;
  const eligible=[];
  sortedTopics(sub.topics).forEach(t=>{
    const directCards=(t.cards||[]).filter(c=>c.answer&&c.answer.trim());
    const eligibleSts=sortedSubtopics(t.subtopics).map(st=>{
      const n=(st.cards||[]).filter(c=>c.answer&&c.answer.trim()).length;
      return n>0?{id:st.id,name:st.name,count:n}:null;
    }).filter(Boolean);
    if(directCards.length||eligibleSts.length)
      eligible.push({id:t.id,name:t.name,directCount:directCards.length,subtopics:eligibleSts});
  });
  if(!eligible.length){alert('No cards with model answers to study. Add answers to your cards first.');return;}

  let selHtml='';
  eligible.forEach(t=>{
    const hasSubs=t.subtopics.length>0;
    selHtml+=`<div class="study-topic-block">
      <label class="study-topic-label">
        <input type="checkbox" class="study-topic-cb" data-tid="${t.id}" checked onchange="onStudyTopicCb(this)">
        ${esc(t.name)}${!hasSubs&&t.directCount?`<span style="font-size:11px;color:var(--text3);font-weight:400;margin-left:4px">(${t.directCount} card${t.directCount!==1?'s':''})</span>`:''}
      </label>`;
    if(hasSubs){
      selHtml+=`<div class="study-subtopic-list">`;
      t.subtopics.forEach(st=>{
        selHtml+=`<label class="study-subtopic-item"><input type="checkbox" class="study-st-cb" data-tid="${t.id}" data-stid="${st.id}" checked> ${esc(st.name)} <span style="font-size:11px;color:var(--text3);margin-left:4px">(${st.count})</span></label>`;
      });
      if(t.directCount){
        selHtml+=`<label class="study-subtopic-item"><input type="checkbox" class="study-st-cb" data-tid="${t.id}" data-stid="__direct__" checked> General cards <span style="font-size:11px;color:var(--text3);margin-left:4px">(${t.directCount})</span></label>`;
      }

function startSession(){
  const sub=state.subjects.find(s=>s.id===state.activeSubId);if(!sub)return;
  const selectedKeys=[];
  document.querySelectorAll('.study-st-cb:checked').forEach(cb=>{
    selectedKeys.push({tid:cb.dataset.tid,stid:cb.dataset.stid==='__direct__'?null:cb.dataset.stid});
  });
  document.querySelectorAll('.study-topic-cb:checked').forEach(cb=>{
    const tid=cb.dataset.tid;
    if(!document.querySelectorAll(`.study-st-cb[data-tid="${tid}"]`).length)
      selectedKeys.push({tid,stid:null});
  });
  if(!selectedKeys.length){alert('Select at least one topic or subtopic.');return;}

  const shuffled=document.getElementById('studyOrderShuffled').classList.contains('active');
  const timerEnabled=document.getElementById('studyTimerOn').classList.contains('active');
  // Same order as the subject page: topics, then each topic's subtopics, then
  // its general cards, with cards ordered by spec point. _ord remembers that
  // position so breakdowns stay in order after shuffling.
  const picked=new Set(selectedKeys.map(k=>k.tid+'|'+(k.stid||'')));
  let cards=[];
  sortedTopics(sub.topics).forEach(t=>{
    const add=(list,stid,subtopicName)=>{
      if(!picked.has(t.id+'|'+(stid||'')))return;
      sortCardsBySpec((list||[]).filter(c=>c.answer&&c.answer.trim())).forEach(c=>
        cards.push(Object.assign({},c,{_tid:t.id,_stid:stid,_topicName:t.name,_subtopicName:subtopicName,_rating:null,_ord:cards.length})));
    };
    sortedSubtopics(t.subtopics).forEach(st=>add(st.cards,st.id,st.name));
    add(t.cards,null,'');
  });
  if(!cards.length){alert('No cards with answers found in selection.');return;}
  if(shuffled)shuffle(cards);

  cancelStudySetup();
  _session={cards,idx:0,revealed:false,rated:false,shuffled,timerEnabled,startTime:Date.now(),timerInterval:null,subjectName:sub.name,subjectId:sub.id};

  document.getElementById('topbarActions').innerHTML=`<button class="btn btn-sm btn-danger" onclick="exitSession()">Exit session</button>`;
  if(timerEnabled){
    _session.timerInterval=setInterval(()=>{
      const el=document.getElementById('sessionTimer');if(!el)return;
      el.textContent=formatTime(Math.floor((Date.now()-_session.startTime)/1000));
    },1000);
  }
  renderSessionView();
}

function rateCard(rating){
  if(!_session||_session.rated)return;
  _session.rated=true;
  const{cards,idx,subjectId}=_session;
  cards[idx]._rating=rating;
  try{
    const sub=state.subjects.find(s=>s.id===subjectId);
    if(sub){
      const sc=cards[idx];
      const t=(sub.topics||[]).find(t=>t.id===sc._tid);
      if(t){
        const pool=sc._stid?((t.subtopics||[]).find(st=>st.id===sc._stid)||{cards:[]}).cards:t.cards;
        const c=(pool||[]).find(c=>c.id===sc.id);
        if(c){
          if(!c.confidence)c.confidence={lastRating:null,history:[],timesGot:0,timesAlmost:0,timesMissed:0};
          c.confidence.lastRating=rating;
          if(!c.confidence.history)c.confidence.history=[];
          c.confidence.history.push({date:new Date().toISOString(),rating});capHistory(c);
          if(rating==='got')c.confidence.timesGot=(c.confidence.timesGot||0)+1;
          else if(rating==='almost')c.confidence.timesAlmost=(c.confidence.timesAlmost||0)+1;
          else c.confidence.timesMissed=(c.confidence.timesMissed||0)+1;
        }
      }
    }
    save();
  }catch(e){}
  document.querySelectorAll('.conf-btn').forEach(b=>{
    b.disabled=true;b.style.opacity=b.classList.contains(rating)?'1':'0.35';
  });
  setTimeout(()=>{
    if(!_session||_session.idx!==idx)return;
    _session.idx++;
    if(_session.idx>=_session.cards.length)showSessionEnd();else renderSessionCard();
  },400);
}

function showSessionEnd(){
  if(_session.timerInterval){clearInterval(_session.timerInterval);_session.timerInterval=null;}
  const{cards,startTime,timerEnabled,subjectName}=_session;
  const duration=Math.floor((Date.now()-startTime)/1000);
  const got=cards.filter(c=>c._rating==='got').length;
  const almost=cards.filter(c=>c._rating==='almost').length;
  const missed=cards.filter(c=>c._rating==='missed').length;
  const total=cards.length;

  const groups={};
  cards.forEach(c=>{
    const key=c._stid||c._tid,name=c._subtopicName?c._subtopicName:(c._topicName+(cards.some(x=>x._tid===c._tid&&x._stid)?' · general':''));
    if(!groups[key])groups[key]={name,ord:c._ord,got:0,almost:0,missed:0};
    groups[key].ord=Math.min(groups[key].ord,c._ord);
    if(c._rating==='got')groups[key].got++;
    else if(c._rating==='almost')groups[key].almost++;
    else if(c._rating==='missed')groups[key].missed++;
  });
  const breakdownRows=Object.values(groups).sort((a,b)=>a.ord-b.ord).map(g=>`<div class="end-topic-row">
    <span class="end-topic-name">${esc(g.name)}</span>
    <div class="end-topic-pills">
      ${g.got?`<span class="end-pill got">${g.got} got</span>`:''}
      ${g.almost?`<span class="end-pill almost">${g.almost} almost</span>`:''}
      ${g.missed?`<span class="end-pill missed">${g.missed} missed</span>`:''}
    </div></div>`).join('');

  document.getElementById('mainContent').innerHTML=`<div class="session-view">
    <div class="session-topbar">
      <div style="width:80px"></div>
      <div class="session-progress-text">Session complete</div>
      ${timerEnabled?`<div class="session-timer">${formatTime(duration)}</div>`:`<div class="session-timer"></div>`}
    </div>
    <div class="session-content"><div class="session-end">
      <div class="session-end-title">Done!</div>
      <div class="session-end-sub">${total} card${total!==1?'s':''} · ${formatTime(duration)}</div>
      <div class="end-stats-row">
        <div class="end-stat got"><div class="end-stat-n">${got}</div><div class="end-stat-l">Got it</div></div>
        <div class="end-stat almost"><div class="end-stat-n">${almost}</div><div class="end-stat-l">Almost</div></div>
        <div class="end-stat missed"><div class="end-stat-n">${missed}</div><div class="end-stat-l">Missed it</div></div>
      </div>
      ${breakdownRows?`<div class="end-breakdown"><div class="end-breakdown-title">Breakdown</div>${breakdownRows}</div>`:''}
      <div class="end-actions">
        ${missed?`<button class="btn btn-primary" onclick="retryMissed()">Retry missed (${missed})</button>`:''}
        <button class="btn" onclick="exitSession()">Back to subject</button>
      </div>
    </div></div>
  </div>`;
  document.getElementById('topbarActions').innerHTML=`<button class="btn btn-sm" onclick="exitSession()">Back to subject</button>`;

  Sync.queueSession({
    date:new Date().toISOString(),subjectName,total,got,almost,missed,duration,
    breakdown:Object.values(groups).sort((a,b)=>a.ord-b.ord).map(({ord,...g})=>g)
  });
}

function retryMissed(){
  const missed=(_session.cards||[]).filter(c=>c._rating==='missed');
  if(!missed.length)return;
  _session={
    cards:(_session.shuffled?shuffle:x=>x.sort((a,b)=>a._ord-b._ord))(missed.map(c=>Object.assign({},c,{_rating:null}))),
    idx:0,revealed:false,rated:false,
    shuffled:_session.shuffled,timerEnabled:_session.timerEnabled,
    startTime:Date.now(),timerInterval:null,
    subjectName:_session.subjectName,subjectId:_session.subjectId
  };
  if(_session.timerEnabled){
    _session.timerInterval=setInterval(()=>{
      const el=document.getElementById('sessionTimer');if(!el)return;
      el.textContent=formatTime(Math.floor((Date.now()-_session.startTime)/1000));
    },1000);
  }
  document.getElementById('topbarActions').innerHTML=`<button class="btn btn-sm btn-danger" onclick="exitSession()">Exit session</button>`;
  renderSessionView();
}

function exitSession(){
  if(_session?.timerInterval){clearInterval(_session.timerInterval);_session.timerInterval=null;}
  _session=null;
  renderMain();
}

// ── Nested lists ──
// Quill stores a nested list as one flat list whose items carry ql-indent-N
// classes, which only the editor knows how to draw. For display, rebuild real
// nested <ul>/<ol> elements so indentation and numbering (1, a, i) match.
function nestQuillLists(root){
  const parents=new Set([...root.querySelectorAll('ul,ol')].map(l=>l.parentNode));
  parents.forEach(parent=>{
    let run=[];
    const flush=()=>{if(run.length)nestRun(run);run=[];};
    [...parent.childNodes].forEach(n=>{
      if(n.nodeType===1&&(n.tagName==='UL'||n.tagName==='OL'))run.push(n);
      else if(!(n.nodeType===3&&!n.nodeValue.trim()))flush();
    });
    flush();
  });
}
function nestRun(run){
  if(!run.some(l=>l.querySelector(':scope>li[class*="ql-indent-"]')))return;
  const tops=[],stack=[];
  const hostLi=k=>{if(!stack[k].li){const li=document.createElement('li');li.className='nest-only';stack[k].list.appendChild(li);stack[k].li=li;}return stack[k].li;};
  run.forEach(list=>[...list.children].forEach(li=>{
    if(li.tagName!=='LI')return;
    const m=/(?:^|\s)ql-indent-(\d+)/.exec(li.className||''),lvl=m?Math.min(+m[1],8):0;
    if(m)li.classList.remove('ql-indent-'+m[1]);
    if(!li.className)li.removeAttribute('class');
    stack.length=Math.min(stack.length,lvl+1);
    for(let k=0;k<=lvl;k++){
      const type=k===lvl||!stack[k]?list.tagName:stack[k].list.tagName;
      if(!stack[k]||(k===lvl&&stack[k].list.tagName!==type)){
        const L=document.createElement(type);
        if(k===0)tops.push(L);else hostLi(k-1).appendChild(L);
        stack[k]={list:L,li:null};stack.length=k+1;
      }
    }
    stack[lvl].list.appendChild(li);stack[lvl].li=li;
  }));
  const anchor=run[0];
  tops.forEach(t=>anchor.parentNode.insertBefore(t,anchor));
  run.forEach(l=>l.remove());
}

// shortcuts work on the subject page when you're not typing, 'session' ones

  toggleAnswer:{scope:'app',label:'Show / hide answer',desc:'Of the selected card'},

  editCard:{scope:'app',label:'Edit selected card'},
  toggleSidebar:{scope:'app',label:'Show / hide the sidebar'},
  showHelp:{scope:'app',label:'Show these shortcuts'},
  reveal:{scope:'session',label:'Reveal the answer',desc:'Ctrl/Cmd+Enter also works while typing'},

  insertTable:{scope:'editor',label:'Insert table'}
};
const HOTKEY_GROUPS=[
  {scope:'app',title:'Subject page',text:"Work when you're not typing in a box. Click a card (or use the next/previous keys) to select it."},
  {scope:'session',title:'Study session',text:'Rating keys work once the answer is showing and you have clicked out of your answer box.'},
  {scope:'editor',title:'Answer & note editors',text:'Work while typing in an editor, so they need Ctrl/Cmd or Alt.'}
];
function normKey(k){return k&&k.length===1?k.toLowerCase():k;}
function matchHotkey(e,hk){
  if(!hk||!hk.key||normKey(e.key)!==normKey(hk.key))return false;
  if(!!(e.ctrlKey||e.metaKey)!==!!hk.shortKey||!!e.altKey!==!!hk.altKey)return false;
  // Shift only matters for letters; for "?" or "/" it's part of the character.
  return!(/^[a-z]$/i.test(hk.key)&&!!e.shiftKey!==!!hk.shiftKey);
}

      if(visible(id)){close();return;}

  }

  const hk=state.hotkeys;
  if(_session){

  }

  const is=k=>matchHotkey(e,hk[k]);

// ── Side-by-side marking ──
// On reveal, the model answer's key terms are highlighted: green if your blurt
// mentions them, amber if not. Matching is forgiving about word endings
// ("molecules" ≈ "molecule", "photosynthetic" ≈ "photosynthesis") but it is
// only a hint — you still choose the rating.
const STOPWORDS=new Set(('a about above after again against all also am an and any are as at be because been before being below between both but by can could did do does doing down during each either etc few for from further had has have having he her here hers him his how however i if in into is it its itself just less like may me might more most much must my no nor not of off often on once one only or other our out over own per same shall she should so some such than that the their them then there these they this those through thus to too under until up upon us use used uses using very via was we were what when where whether which while who whom whose why will with within without would yet you your').split(' '));
const TERM_RE=/\d+(?:[.,]\d+)*|\p{L}[\p{L}\p{N}'’]*(?:-[\p{L}\p{N}]+)*/gu;
function stemWord(w){
  w=w.toLowerCase().replace(/['’]s?$/,'');
  if(/\d/.test(w))return w;
  if(w.length>4&&w.endsWith('ies'))return w.slice(0,-3)+'y';
  for(const s of['ational','ation','ness','ment','ing','edly','ed','ly'])if(w.length-s.length>=4&&w.endsWith(s)){w=w.slice(0,-s.length);break;}
  if(w.length>3&&w.endsWith('s')&&!/(ss|us|is)$/.test(w))w=w.slice(0,-1);
  if(w.length>4&&w.endsWith('e'))w=w.slice(0,-1);
  return w;
}
function isKeyTerm(tok){return/\d/.test(tok)||/^[A-Z]{2,}$/.test(tok)||(tok.length>=3&&!STOPWORDS.has(tok.toLowerCase()));}
function stemsMatch(a,b){
  if(a===b)return true;
  const m=Math.min(a.length,b.length);if(m<6)return false;
  let i=0;while(i<m&&a[i]===b[i])i++;
  return i>=Math.max(6,Math.ceil(m*.8));
}
function highlightKeyTerms(root,blurt){
  const have=[...new Set((blurt.match(TERM_RE)||[]).map(stemWord))],haveSet=new Set(have);
  const found=s=>haveSet.has(s)||have.some(h=>stemsMatch(h,s));
  const terms=new Map(),nodes=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const text=n.nodeValue,frag=document.createDocumentFragment();let last=0,any=false,m;
    TERM_RE.lastIndex=0;
    while((m=TERM_RE.exec(text))){
      if(!isKeyTerm(m[0]))continue;
      const s=stemWord(m[0]);if(!terms.has(s))terms.set(s,found(s));
      frag.append(text.slice(last,m.index));
      const span=document.createElement('span');span.className='kw '+(terms.get(s)?'hit':'miss');span.textContent=m[0];
      frag.append(span);last=m.index+m[0].length;any=true;
    }
    if(any){frag.append(text.slice(last));n.replaceWith(frag);}
  });
  let hits=0;terms.forEach(v=>{if(v)hits++;});
  return{hits,total:terms.size};
}
const RATING_NAMES={got:'Got it',almost:'Almost',missed:'Missed it'};
function updateKeyTerms(){
  const body=document.getElementById('sessionAnswerBody');if(!body||!_session)return;
  const c=_session.cards[_session.idx],p=state.studyPrefs||{};
  const score=document.getElementById('kwScore'),sug=document.getElementById('rateSuggest');
  body.innerHTML=c.answer?renderAnswer(c.answer):'';
  score.textContent='';sug.innerHTML='';markSuggestion(null);
  if(p.highlightTerms===false)return;
  const r=highlightKeyTerms(body,(document.getElementById('sessionBlurt')||{}).value||'');
  if(!r.total)return;
  score.innerHTML=`<span class="kw hit">${r.hits}</span> of ${r.total} key terms in your answer`;
  if(p.suggestRating!==false&&r.total>=3){
    const f=r.hits/r.total,s=f>=.8?'got':f>=.5?'almost':'missed';
    sug.innerHTML=`Suggested from key terms: <strong>${RATING_NAMES[s]}</strong>. You decide.`;
    markSuggestion(s);
  }
}

// ── Undo for deletes ──
// Where an item lived, by ids, so undo still works after a re-render or sync.
function resolveList(path){
  if(path.kind==='subjects')return state.subjects;
  const sub=state.subjects.find(s=>s.id===path.sub);if(!sub)return null;
  if(path.kind==='topics')return sub.topics||(sub.topics=[]);
  const t=(sub.topics||[]).find(t=>t.id===path.tid);if(!t)return null;
  if(path.kind==='subtopics')return t.subtopics||(t.subtopics=[]);
  if(!path.stid)return t.cards||(t.cards=[]);
  const st=(t.subtopics||[]).find(s=>s.id===path.stid);
  return st?(st.cards||(st.cards=[])):null;
}
function removeWithUndo(path,id,label){
  const list=resolveList(path);if(!list)return null;
  const i=list.findIndex(x=>x.id===id);if(i<0)return null;
  const[item]=list.splice(i,1);markDeleted(id);
  toast(`Deleted ${label}.`,{action:{label:'Undo',fn:()=>undoDelete(path,i,item)}});
  return item;
}
function undoDelete(path,i,item){
  const list=resolveList(path);
  if(!list){toast("Couldn't undo: the place it was in has been deleted too.");return;}
  if(list.some(x=>x.id===item.id))return;
  delete state.deleted[item.id];item.updatedAt=Date.now();
  list.splice(Math.min(i,list.length),0,item);
  save();
  if(path.kind==='subjects')openSubject(item.id);else rerenderKeepingDrafts();
}

const SPEC_NUM='(?:sp\\s*)?[A-Z]{0,2}\\d+(?:\\.\\d+)*[a-z]?';
const SPEC_ONLY=new RegExp('^'+SPEC_NUM+'$','i');
const SPEC_LINE=new RegExp('^\\s*('+SPEC_NUM+')[.):]?\\s+(.+)$','i');
const SPEC_LEAD=new RegExp('^('+'(?:sp\\s*)?[A-Z]{0,2}\\d+(?:\\.\\d+)+[a-z]?'+')[.):]?\\s+(.+)$','i');
// Answer text → the same HTML Quill produces: "-", "*", "•" or "1." lines become
// list items, and every 2 spaces (or a tab) of indent nests one level deeper.
function answerToHtml(text){
  const lines=String(text||'').replace(/\r\n?/g,'\n').replace(/\t/g,'  ').split('\n');
  let html='',open=null;
  const close=()=>{if(open){html+=`</${open}>`;open=null;}};
  lines.forEach(l=>{
    if(!l.trim())return;
    const m=l.match(/^(\s*)([-*•–]|\d+[.)])\s+(.*)$/);
    if(m){
      const type=/\d/.test(m[2])?'ol':'ul',lvl=Math.min(8,Math.floor(m[1].length/2));
      if(open!==type){close();html+=`<${type}>`;open=type;}
      html+=`<li${lvl?` class="ql-indent-${lvl}"`:''}>${esc(m[3].trim())}</li>`;
    }else{close();html+=`<p>${esc(l.trim())}</p>`;}
  });
  close();return html;
}
function bulkCard(q,a,sp,hint){return{q:String(q||'').trim(),answerText:String(a||'').trim(),sp:String(sp||'').trim(),hint:String(hint||'').trim()};}
function bulkColumns(parts){
  parts=parts.map(p=>p.trim());
  if(parts.length>=3&&SPEC_ONLY.test(parts[0]))return bulkCard(parts[1],parts[2],parts[0],parts[3]);
  return bulkCard(parts[0],parts[1],'',parts[2]);
}
function parseBulkCards(text){
  text=String(text||'').replace(/\r\n?/g,'\n');
  const lines=text.split('\n'),rows=lines.filter(l=>l.trim());
  if(!rows.length)return{format:null,cards:[]};
  if(rows.some(l=>l.includes('\t')))return{format:'Columns separated by tabs (pasted from a spreadsheet or table)',cards:rows.map(l=>bulkColumns(l.split('\t')))};
  if(rows.some(l=>/^\s*Q\s*[:.)]/i.test(l))){
    const cards=[];let cur=null,field=null;
    lines.forEach(l=>{
      const m=l.match(/^\s*(Q|A|SP|Spec|Hint|H)\s*[:.)]\s?(.*)$/i);
      if(m){
        const k=m[1].toLowerCase();
        if(k==='q'){cur={q:'',a:'',sp:'',hint:''};cards.push(cur);field='q';}
        else if(!cur){cur={q:'',a:'',sp:'',hint:''};cards.push(cur);}
        if(k!=='q')field=k==='a'?'a':k==='h'||k==='hint'?'hint':'sp';
        cur[field]+=(cur[field]?'\n':'')+m[2];
      }else if(cur&&field&&l.trim())cur[field]+=(field==='a'?'\n':' ')+(field==='a'?l:l.trim());
    });
    return{format:'Q: / A: blocks',cards:cards.map(c=>bulkCard(c.q,c.a,c.sp,c.hint))};
  }
  if(rows.filter(l=>l.includes('|')).length>=rows.length/2)return{format:'Columns separated by |',cards:rows.map(l=>bulkColumns(l.split('|')))};
  return{format:'Question on the first line, answer below, blank line between cards',cards:text.split(/\n\s*\n/).filter(b=>b.trim()).map(b=>{
    const ls=b.split('\n').filter(l=>l.trim());const m=ls[0].trim().match(SPEC_LEAD);
    return m?bulkCard(m[2],ls.slice(1).join('\n'),m[1]):bulkCard(ls[0],ls.slice(1).join('\n'));
  })};
}
// Spec lists: "4.1 Heading" lines followed by "4.1.1 Statement" lines. A number
// that prefixes later numbers is a heading; lines without a number continue the
// line above (text copied from PDFs wraps).
function parseSpec(text){
  const items=[];
  String(text||'').replace(/\r\n?/g,'\n').split('\n').forEach(l=>{
    if(!l.trim())return;
    const m=l.match(SPEC_LINE);
    if(m)items.push({num:m[1].trim(),text:m[2].trim()});
    else if(items.length)items[items.length-1].text+=' '+l.trim();
  });
  const low=items.map(it=>it.num.toLowerCase());
  items.forEach((it,i)=>{it.heading=low.some((o,j)=>j!==i&&o.startsWith(low[i]+'.'));});
  items.forEach(it=>{
    if(it.heading)return;
    let best=null;items.forEach(h=>{if(h.heading&&it.num.toLowerCase().startsWith(h.num.toLowerCase()+'.')&&(!best||h.num.length>best.num.length))best=h;});
    it.parent=best;
  });
  return items;
}

  if(!dest)return plan;
  if(b.mode==='qa'){
    const r=parseBulkCards(text);plan.format=r.format;
    r.cards.forEach(c=>{if(!c.q){plan.skipped++;return;}plan.cards.push({list:dest,where:null,c:{q:c.q,sp:c.sp,hint:c.hint,answer:answerToHtml(c.answerText)}});});
    return plan;
  }
  const items=parseSpec(text);if(items.length)plan.format='Specification points';
  const useHeadings=b.headings&&!loc.stid;
  if(b.headings&&loc.stid&&items.some(i=>i.heading))plan.notes.push('Headings are skipped when adding into a subtopic. Choose a topic to turn them into subtopics.');
  const t=state.subjects.find(s=>s.id===loc.sub).topics.find(t=>t.id===loc.tid);
  const subFor=new Map();
  const existingSp=list=>new Set((list||[]).map(c=>(c.sp||'').trim().toLowerCase()).filter(Boolean));
  const spSeen=new Map();
  items.forEach(it=>{
    if(it.heading)return;
    let list=dest,where=null;
    if(useHeadings&&it.parent){
      const name=`${it.parent.num} ${it.parent.text}`;
      if(!subFor.has(name)){
        const ex=(t.subtopics||[]).find(st=>st.name.trim().toLowerCase()===name.toLowerCase());
        subFor.set(name,ex?{list:ex.cards||(ex.cards=[]),name,existing:true}:{list:null,name,existing:false,cards:[]});
        if(!ex)plan.subtopics.push(subFor.get(name));
      }
      const s=subFor.get(name);list=s.list;where=s;
    }
    const key=where?where.name:'_';
    if(!spSeen.has(key))spSeen.set(key,existingSp(list));
    if(spSeen.get(key).has(it.num.toLowerCase())){plan.dupes++;return;}
    spSeen.get(key).add(it.num.toLowerCase());
    plan.cards.push({list,where,c:{q:it.text,sp:it.num,hint:'',answer:''}});
  });
  if(!useHeadings)plan.skipped=items.filter(i=>i.heading).length;
  return plan;
}
function renderBulkPreview(){
  if(!_bulk)return;
  const plan=planBulk(),el=document.getElementById('bulkPreview'),btn=document.getElementById('bulkAddBtn'),sum=document.getElementById('bulkSummary');
  const n=plan.cards.length,ns=plan.subtopics.length;
  btn.disabled=!n;btn.textContent=n?`Add ${n} card${n!==1?'s':''}`:'Add';
  sum.textContent=(n?`${n} card${n!==1?'s':''}${ns?` in ${ns} new subtopic${ns!==1?'s':''}`:''}`:'Nothing new to add')+(plan.dupes?` · ${plan.dupes} already there`:'')+(plan.skipped?` · ${plan.skipped} skipped`:'');
  if(!n&&plan.dupes){el.innerHTML=`<div class="bulk-empty">All ${plan.dupes} of these are already in this place (matched by spec point), so there is nothing new to add.</div>`;return;}
  if(!n){sum.textContent='';el.innerHTML=`<div class="bulk-empty">${(document.getElementById('bulkText').value.trim())?"Couldn't find any cards yet. Check “How to format it”.":'Your cards will appear here as you paste.'}</div>`;return;}
  let h=`<div class="bulk-format">Detected: ${esc(plan.format||'')}</div>`+plan.notes.map(x=>`<div class="bulk-warn">${esc(x)}</div>`).join('');
  let lastWhere;
  plan.cards.slice(0,200).forEach(({c,where})=>{
    if(where!==lastWhere){lastWhere=where;if(where)h+=`<div class="bulk-sub">${where.existing?'Into subtopic':'New subtopic'}: ${esc(where.name)}</div>`;}
    h+=`<div class="bulk-row">${c.sp?`<span class="bulk-sp">${esc(c.sp)}</span>`:''}<div class="bulk-q">${esc(c.q)}</div>${c.answer?`<div class="bulk-a rich">${sanitizeRich(c.answer)}</div>`:_bulk.mode==='qa'?'<div class="bulk-a bulk-missing">No answer, so it won’t appear in study sessions until you add one</div>':''}</div>`;
  });
  if(n>200)h+=`<div class="bulk-empty">…and ${n-200} more</div>`;
  el.innerHTML=h;
}
function commitBulk(){
  const plan=planBulk();if(!plan.cards.length)return;
  const loc=parseLoc(_bulk.loc),now=Date.now(),created=[];
  const t=state.subjects.find(s=>s.id===loc.sub).topics.find(t=>t.id===loc.tid);
  plan.subtopics.forEach(s=>{const st={id:uid(),name:s.name,cards:[],createdAt:now,updatedAt:now};(t.subtopics=t.subtopics||[]).push(st);s.list=st.cards;s.id=st.id;created.push(st.id);});
  plan.cards.forEach(({list,where,c})=>{
    const card={id:uid(),sp:c.sp,q:c.q,hint:c.hint,answer:c.answer,myNote:'',createdAt:now,updatedAt:now};
    (where?where.list:list).push(card);if(!where||where.existing)created.push(card.id);
  });
  if(plan.subtopics.length)state.openSubtopics=[...new Set([...(state.openSubtopics||[]),...plan.subtopics.map(s=>s.id)])];
  const n=plan.cards.length,ns=plan.subtopics.length;
  closeBulk();
  if(loc.sub!==state.activeSubId)state.activeSubId=loc.sub;
  save();renderSidebar();renderMain();
  toast(`Added ${n} card${n!==1?'s':''}${ns?` in ${ns} new subtopic${ns!==1?'s':''}`:''}.`,{action:{label:'Undo',fn:()=>removeIds(new Set(created))}});
}
// Remove items (anywhere) by id, e.g. to undo a bulk add.
function removeIds(ids){
  const strip=list=>(list||[]).filter(x=>{if(ids.has(x.id)){markDeleted(x.id);return false;}return true;});
  state.subjects.forEach(s=>(s.topics||[]).forEach(t=>{t.cards=strip(t.cards);t.subtopics=strip(t.subtopics);(t.subtopics||[]).forEach(st=>{st.cards=strip(st.cards);});}));
  save();rerenderKeepingDrafts();
}

// ── Search ──
const _plainCache=new Map();
function plainText(html){
  if(!html)return'';
  if(!/[<&]/.test(html))return html;
  if(_plainCache.has(html))return _plainCache.get(html);
  const t=document.createElement('template');t.innerHTML=html.replace(/<(br|\/p|\/li|\/div|\/td|\/th)>/gi,' $&');
  const out=t.content.textContent.replace(/\s+/g,' ').trim();
  if(_plainCache.size>5000)_plainCache.clear();
  _plainCache.set(html,out);return out;
}
let _searchSel=0,_searchResults=[];
function openSearch(){
  let m=document.getElementById('searchModal');
  if(!m){
    m=document.createElement('div');m.id='searchModal';m.className='tm-overlay search-overlay';
    m.innerHTML=`<div class="tm-box search-box" role="dialog" aria-label="Search">
      <div class="search-bar"><svg width="15" height="15" viewBox="0 0 13 13" fill="none"><circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M9 9l2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <input id="searchInput" class="search-input" type="text" autocomplete="off" spellcheck="false" placeholder="Search questions, answers, notes, spec points and topics…"><kbd>Esc</kbd></div>
      <div id="searchResults" class="search-results"></div></div>`;
    document.body.appendChild(m);
    m.addEventListener('mousedown',e=>{if(e.target===m)closeSearch();});
    const inp=m.querySelector('#searchInput');
    inp.addEventListener('input',()=>{_searchSel=0;renderSearch();});
    inp.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();_searchSel=Math.max(0,Math.min(_searchResults.length-1,_searchSel+(e.key==='ArrowDown'?1:-1)));renderSearch(true);}
      else if(e.key==='Enter'&&_searchResults[_searchSel]){e.preventDefault();goToResult(_searchResults[_searchSel]);}
    });
  }
  m.hidden=false;
  const inp=m.querySelector('#searchInput');inp.select();inp.focus();renderSearch();
}
function closeSearch(){const m=document.getElementById('searchModal');if(m)m.hidden=true;}
function searchAll(query){
  const terms=query.toLowerCase().split(/\s+/).filter(Boolean);if(!terms.length)return[];
  const res=[],has=(s,x)=>String(s||'').toLowerCase().includes(x);
  sortedSubjects().forEach(sub=>sortedTopics(sub.topics).forEach(t=>{
    const section=(st,name)=>{if(terms.every(x=>has(name,x)||has(sub.name,x)))res.push({type:st?'subtopic':'topic',sub,t,st,score:5});};
    section(null,t.name);
    const scan=(c,st)=>{
      const a=plainText(c.answer),n=plainText(c.myNote);
      const hay=[c.sp,c.q,c.hint,a,n,t.name,st&&st.name,sub.name].join(' ').toLowerCase();
      if(!terms.every(x=>hay.includes(x)))return;
      let score=0;terms.forEach(x=>{score+=has(c.q,x)||has(c.sp,x)?4:has(a,x)?2:1;});
      res.push({type:'card',sub,t,st,c,a,n,score:score-(sub.archived?1:0)});
    };
    sortedSubtopics(t.subtopics).forEach(st=>{section(st,st.name);sortCardsBySpec(st.cards||[]).forEach(c=>scan(c,st));});
    sortCardsBySpec(t.cards||[]).forEach(c=>scan(c,null));
  }));
  return res.map((r,i)=>[r,i]).sort((x,y)=>y[0].score-x[0].score||x[1]-y[1]).map(x=>x[0]).slice(0,60);
}
// Escape text and wrap every occurrence of the search terms in <mark>.
function markTerms(text,terms){
  text=String(text||'');
  const low=text.toLowerCase(),on=new Array(text.length).fill(false);
  terms.forEach(x=>{let i=0;while((i=low.indexOf(x,i))>=0){for(let k=i;k<i+x.length;k++)on[k]=true;i+=x.length;}});
  let h='',open=false;
  for(let i=0;i<text.length;i++){if(on[i]!==open){h+=open?'</mark>':'<mark>';open=on[i];}h+=esc(text[i]);}
  return h+(open?'</mark>':'');
}
function snippet(text,terms){
  const low=text.toLowerCase();let i=-1;
  terms.some(x=>{i=low.indexOf(x);return i>=0;});
  if(i<0)return'';
  const s=Math.max(0,i-50),e=Math.min(text.length,i+90);
  return(s?'…':'')+text.slice(s,e)+(e<text.length?'…':'');
}
function renderSearch(keepScroll){
  const q=document.getElementById('searchInput').value.trim(),el=document.getElementById('searchResults');
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  _searchResults=searchAll(q);
  if(!q){el.innerHTML=`<div class="search-empty">Type to search every subject. <span>↑ ↓ to move · Enter to open</span></div>`;return;}
  if(!_searchResults.length){el.innerHTML=`<div class="search-empty">Nothing matches “${esc(q)}”.</div>`;return;}
  el.innerHTML=_searchResults.map((r,i)=>{
    const path=[r.sub.name,r.t.name,r.st&&r.st.name].filter(Boolean).map(esc).join(' › ');
    const dot=`<span class="subject-dot" style="background:${r.sub.color}"></span>`;
    const arch=r.sub.archived?'<span class="search-tag">Archived</span>':'';
    if(r.type!=='card')return`<div class="search-row${i===_searchSel?' sel':''}" data-i="${i}">${dot}<div class="search-main"><div class="search-q">${markTerms(r.st?r.st.name:r.t.name,terms)} <span class="search-tag">${r.type}</span>${arch}</div><div class="search-path">${esc(r.sub.name)}${r.st?' › '+esc(r.t.name):''}</div></div></div>`;
    const sn=snippet(r.a,terms)||snippet(r.n,terms);
    return`<div class="search-row${i===_searchSel?' sel':''}" data-i="${i}">${dot}<div class="search-main">
      <div class="search-q">${r.c.sp?`<span class="search-sp">${markTerms(r.c.sp,terms)}</span>`:''}${markTerms(r.c.q,terms)}${arch}</div>
      ${sn?`<div class="search-snip">${markTerms(sn,terms)}</div>`:''}<div class="search-path">${path}</div></div></div>`;
  }).join('');
  el.querySelectorAll('.search-row').forEach(row=>{
    row.onclick=()=>goToResult(_searchResults[+row.dataset.i]);
    row.onmousemove=()=>{if(_searchSel!==+row.dataset.i){_searchSel=+row.dataset.i;el.querySelectorAll('.search-row').forEach(r=>r.classList.toggle('sel',+r.dataset.i===_searchSel));}};
  });
  const sel=el.querySelector('.search-row.sel');if(sel&&keepScroll)sel.scrollIntoView({block:'nearest'});
}
function goToResult(r){
  closeSearch();
  if(_session)exitSession();
  if(state.activeSubId!==r.sub.id){state.activeSubId=r.sub.id;renderSidebar();}
  state.activeTopicId=r.t.id;state.activeSpFilter=null;state.activeSubtopicSpFilters={};
  if(r.st)state.openSubtopics=[...new Set([...(state.openSubtopics||[]),r.st.id])];
  if(isNarrow()){state.sidebarOpen=false;applySidebar();}
  saveUI();renderSidebar();renderMain();
  if(r.type==='card'){setCardFocus(r.c.id,true);const el=document.getElementById('card-'+r.c.id);if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}}
  else{const el=r.st?document.getElementById('st-'+r.st.id):document.querySelector('.topic-block');if(el)el.scrollIntoView({block:'start',behavior:'smooth'});}
}

let _tourStep=0;
function openTour(){
  let m=document.getElementById('tourModal');
  if(!m){m=document.createElement('div');m.id='tourModal';m.className='tm-overlay';document.body.appendChild(m);
    m.addEventListener('mousedown',e=>{if(e.target===m)closeTour();});
    m.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();tourGo(1);}else if(e.key==='ArrowLeft'){e.preventDefault();tourGo(-1);}});}
  _tourStep=0;renderTour();m.hidden=false;
}
function closeTour(){const m=document.getElementById('tourModal');if(m)m.hidden=true;}
function tourGo(d){const n=_tourStep+d;if(n<0)return;if(n>=TOUR.length){closeTour();return;}_tourStep=n;renderTour();}
function renderTour(){
  const s=TOUR[_tourStep],last=_tourStep===TOUR.length-1,m=document.getElementById('tourModal');

    <div class="tm-foot"><div class="tour-dots">${TOUR.map((_,i)=>`<span class="${i===_tourStep?'on':''}" onclick="_tourStep=${i};renderTour()"></span>`).join('')}</div><span class="spacer"></span>
      ${last?'':'<button class="btn" onclick="closeTour()">Skip</button>'}
      ${_tourStep?'<button class="btn" onclick="tourGo(-1)">Back</button>':''}
      <button class="btn btn-primary" id="tourNext" onclick="tourGo(1)">${last?'Start revising':'Next'}</button></div></div>`;
  const b=m.querySelector('#tourNext');if(b)b.focus();
